      <select style={{width:"auto",padding:"7px 10px"}} value={versFilter} onChange={e=>setVersFilter(e.target.value)}>
        <option value="">Alle Versicherungen</option>{usedVers.map(v=><option key={v.name} value={v.name}>{v.name}</option>)}</select>
      {(empQ||projFilter||versFilter)&&<button className="btn ghost sm" onClick={()=>{setEmpQ("");setProjFilter("");setVersFilter("");}}>Filter zurücksetzen</button>}
      <span className="spacer"></span>
      <span className="mini muted">Rollen für Technikerplanung (in Einstellungen festgelegt)</span>
      <div className="flex wrap" style={{gap:10,fontSize:11.5}}>{usedVers.map(v=>(
        <span key={v.name} className="flex" style={{gap:5}}><span className="dot" style={{background:v.color}}></span>{v.name}</span>))}</div>
    </div>}
    <div className="week-scroll"><div className="week-grid" style={{gridTemplateColumns:"160px repeat("+days.length+",minmax(140px,1fr))"}}>
      <div className="wg-emp corner">Techniker</div>

        {days.map((d,i)=>{const date=ymd(d);const items=cellItems(emp.id,date);const cellKey=emp.id+date;

            {items.length>0&&(()=>{const t0=items[0];const p=projects.find(x=>x.nr===t0.projectNr);const col=techColor(t0,versicherungen);
              const label=t0.autohaus||(p?(p.alias||p.name):"Autohaus");const veh=(t0.vehicles||[]).filter(v=>v.kennzeichen||v.vin);const aw=awSum(t0);
              const more=items.length-1;const single=items.length===1;
              return(<div className="chip"
                draggable={single} onDragStart={()=>single&&setDragId(t0.id)} onDragEnd={()=>{setDragId(null);setDropCell(null);}}
                style={{borderLeftColor:col}} title={more>0?items.length+" Technikertermine – klicken zum Aufklappen":label}
                onClick={e=>{e.stopPropagation();setTechPop({employeeId:emp.id,date});}}>
                <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                  <span className="cn" style={{flex:1,minWidth:0}}>{label}</span>
                  {more>0&&<span className="badge b-gray" style={{flexShrink:0,padding:"0 6px",fontSize:10}}>+{more}</span>}</div>
                <span className="cs">{[timeLabel(t0),veh.length?veh.length+" Fzg":"",aw?fmtAW(aw)+" AW":""].filter(Boolean).join(" · ")}</span>
                {(t0.sendLog||[]).length>0&&<span className="cby">✓ versendet</span>}
              </div>);})()}
            {items.length>0&&dayAW>0&&<div className="mini muted" style={{position:"absolute",bottom:2,right:5,fontSize:9}}>{fmtAW(dayAW)} AW</div>}
            {items.length===0&&!abs&&<div className="add-hint">+</div>}
          </div>);})}
      </React.Fragment>))}
    </div></div>
    {visibleEmployees.length===0&&<div className="empty"><div className="big">Keine Personen für die Technikerplanung</div>
      <div>Lege unter „Einstellungen → Rollen in der Planung" fest, welche Rollen hier erscheinen, und weise den Mitarbeitern die passende Rolle zu.</div></div>}

    {awRows.length>0&&<div className="card" style={{marginTop:16}}><div className="card-h"><h3>AW-Auslastung · KW {wk}</h3>
      {awCapacity>0?<span className="mini muted">Wochenkapazität je Techniker: {awCapacity} AW (in Einstellungen änderbar)</span>:<span className="mini muted">Tipp: Wochenkapazität in Einstellungen setzen für Auslastung in %</span>}</div>
      <div className="card-b">
        {awRows.map(r=>{const pct=awCapacity>0?Math.round(r.planned/awCapacity*100):0;

  const[allDay,setAllDay]=useState(ed?ed.allDay!==false:false);
  const[startTime,setStartTime]=useState(ed?.startTime||"08:00");const[endTime,setEndTime]=useState(ed?.endTime||"17:00");
  const[vehicles,setVehicles]=useState(ed?.vehicles&&ed.vehicles.length?ed.vehicles:[{kennzeichen:"",vin:"",aw:"",awDone:""}]);
  const[absArt,setAbsArt]=useState("Urlaub");const[absNote,setAbsNote]=useState("");
  const usedVers=versicherungen.filter(v=>v.active!==false);
  const projFiltered=activeProjects.filter(p=>!projQ||p.name.toLowerCase().includes(projQ.toLowerCase())||(p.alias||"").toLowerCase().includes(projQ.toLowerCase())||p.nr.includes(projQ));
  const pickedProject=projects.find(p=>p.nr===projectNr);

  function pickProject(nr){setProjectNr(nr);const p=projects.find(x=>x.nr===nr);
    if(p){if(!autohaus)setAutohaus(p.alias||p.name);if(!adresse&&p.adresse)setAdresse(p.adresse);if(!versicherung&&p.versicherung)setVersicherung(p.versicherung);
      if(!kontaktName&&!kontaktTel&&!kontaktMail&&(p.kontaktName||p.kontaktTel||p.kontaktMail)){setKontaktName(p.kontaktName||"");setKontaktTel(p.kontaktTel||"");setKontaktMail(p.kontaktMail||"");}}}
  function setVeh(i,patch){setVehicles(vs=>vs.map((v,idx)=>idx===i?{...v,...patch}:v));}
  function addVeh(){setVehicles(vs=>[...vs,{kennzeichen:"",vin:"",aw:"",awDone:""}]);}
  function rmVeh(i){setVehicles(vs=>vs.filter((_,idx)=>idx!==i));}

  const cleanVehicles=vehicles.filter(v=>(v.kennzeichen||"").trim()||(v.vin||"").trim()||(v.aw!=="" &&v.aw!=null));
  const base={employeeId:ctx.employeeId,projectNr,autohaus:autohaus.trim(),adresse:adresse.trim(),versicherung,dauer:dauer.trim(),
    notes,note:deriveNoteText(notes),allDay,startTime:allDay?null:startTime,endTime:allDay?null:endTime,
    kontaktName:kontaktName.trim(),kontaktTel:kontaktTel.trim(),kontaktMail:kontaktMail.trim(),
    vehicles:cleanVehicles.map(v=>({kennzeichen:(v.kennzeichen||"").trim(),vin:(v.vin||"").trim(),aw:v.aw===""?"":Number(v.aw),awDone:v.awDone===""?"":Number(v.awDone)}))};
  const project=projects.find(p=>p.nr===projectNr);
  const totalAW=base.vehicles.reduce((s,v)=>s+(parseFloat(v.aw)||0),0);

  async function submitAbsence(){
    const lo=fromDate>toDate?toDate:fromDate,hi=fromDate>toDate?fromDate:toDate;
    if(await api.addAbsence({employeeId:ctx.employeeId,art:absArt,von:lo,bis:hi,note:absNote.trim()}))onClose();
  }
  async function submit(){
    if(mode==="frei")return submitAbsence();
    if(!projectNr){store.showToast("Bitte Projekt wählen");return;}
    for(const v of base.vehicles){if(!v.kennzeichen&&!v.vin){store.showToast("Jedes Fahrzeug braucht Kennzeichen ODER VIN");return;}}
    const lo=fromDate>toDate?toDate:fromDate,hi=fromDate>toDate?fromDate:toDate;
    const dates=datesBetween(lo,hi);
    if(!ed&&emp?.gesperrt){if(!confirm(emp.name+" ist für die Einsatzplanung gesperrt. Trotzdem einplanen?"))return;}
    const conflicts=dates.filter(d=>absenceOn(absences,ctx.employeeId,d));
    if(conflicts.length){const a=absenceOn(absences,ctx.employeeId,conflicts[0]);
      if(!confirm(emp?.name+" ist im gewählten Zeitraum abwesend ("+a.art+", "+conflicts.length+" Tag(e) betroffen). Trotzdem einplanen?"))return;}
    if(pickedProject&&(kontaktName.trim()||kontaktTel.trim()||kontaktMail.trim())&&
      (pickedProject.kontaktName!==kontaktName.trim()||pickedProject.kontaktTel!==kontaktTel.trim()||pickedProject.kontaktMail!==kontaktMail.trim())){
      api.saveProject({...pickedProject,kontaktName:kontaktName.trim(),kontaktTel:kontaktTel.trim(),kontaktMail:kontaktMail.trim()},false);
    }
    if(ed){const ok=await api.updateTech({...base,id:ed.id,date:lo,createdBy:ed.createdBy,sendLog:ed.sendLog});if(!ok)return;
      const extra=datesBetween(lo,hi).filter(d=>d!==lo);
      if(extra.length)await api.addTech(extra.map(d=>({...base,date:d})));onClose();}
    else{const dates=datesBetween(lo,hi);if(await api.addTech(dates.map(d=>({...base,date:d}))))onClose();}
  }
  async function del(){if(await api.deleteTech(ed.id))onClose();}

  const sendMsg=buildTechMessage(emp,{...base,date:ctx.date},project,appUrl);
  const subj="Einsatzplanung "+(autohaus||project?.name||"")+" "+fmtDE(ctx.date);
  const hasPhone=!!(emp?.phone||"").replace(/[^0-9]/g,"");
  function onSend(channel){if(ed)api.logTechSend(ed.id,channel);}
  const mayEdit=store.can("tech_edit");
  const ro=!mayEdit;

  return(<Modal title={(ed?(mayEdit?"Technikertermin bearbeiten":"Technikertermin ansehen"):"Technikertermin")+" · "+(emp?.name||"")+" · "+fmtDE(ctx.date)} onClose={onClose} xwide
    footer={mayEdit?<>{ed&&<button className="btn danger" onClick={del}><Ic d={ICONS.trash}/> Löschen</button>}
      <span className="spacer"></span><button className="btn" onClick={onClose}>Abbrechen</button>
      <button className="btn primary" onClick={submit}>{ed?"Speichern":"Anlegen"}</button></>
      :<><span className="mini muted">Keine Berechtigung zum Bearbeiten.</span><span className="spacer"></span><button className="btn" onClick={onClose}>Schließen</button></>}>
    {!ed&&<div className="pill-tabs" style={{marginBottom:16}}>
      <button className={mode==="tech"?"active":""} onClick={()=>setMode("tech")}>Techniker-Einsatz</button>
      <button className={mode==="frei"?"active":""} onClick={()=>setMode("frei")}>Abwesenheit / Frei</button></div>}

      <div className="field"><label>Art</label>
        <select value={absArt} onChange={e=>setAbsArt(e.target.value)}>{ABSENCE_ARTEN.map(a=><option key={a}>{a}</option>)}</select>

          <input type="date" value={fromDate} onChange={e=>{setFromDate(e.target.value);if(e.target.value>toDate)setToDate(e.target.value);}}/></div>
        <div className="field"><label>Bis</label><input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}/></div></div>
      <div className="field"><label>Bemerkung (optional)</label>
        <textarea value={absNote} onChange={e=>setAbsNote(e.target.value)} placeholder="Zusätzliche Info…"/></div>
    </>:(ro?<>
      <div className="notify-box" style={{marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:15}}>{pickedProject?((pickedProject.alias?pickedProject.alias+" · ":"")+pickedProject.name):(autohaus||"Technikereinsatz")}</div>
        {pickedProject&&<div className="mini muted">Projekt-Nr. {pickedProject.nr}</div>}</div>
      <div className="row2">
        <div className="field"><label>Autohaus</label><div className="ro-val">{autohaus||"—"}</div></div>
        <div className="field"><label>Datum / Zeit</label><div className="ro-val">{fmtDE(ctx.date)} · {allDay?"ganztägig":((startTime||"")+(endTime?"–"+endTime:"")+" Uhr")}</div></div></div>
      <div className="field"><label>Adresse</label><div className="ro-val">{adresse||"—"}</div>
        {adresse.trim()&&<a href={mapsLink(adresse)} target="_blank" rel="noopener" className="btn ghost sm" style={{marginTop:6}}><Ic d={ICONS.pin}/> Route öffnen</a>}</div>
      {dauer&&<div className="field"><label>Einsatzdauer</label><div className="ro-val">{dauer}</div></div>}
      <div className="field"><label>Fahrzeuge · Σ {fmtAW(totalAW)} AW</label>
        {vehicles.filter(v=>v.kennzeichen||v.vin).length===0?<div className="ro-val">—</div>:
          vehicles.filter(v=>v.kennzeichen||v.vin).map((v,i)=>(<div key={i} className="rec-row"><span style={{fontWeight:600}}>{v.kennzeichen||"—"}</span>{v.vin&&<span className="mini muted">{v.vin}</span>}<span className="spacer"></span>{v.aw!==""&&v.aw!=null&&<span className="badge b-gray">{fmtAW(Number(v.aw))} AW</span>}</div>))}</div>
      {deriveNoteText(notes)&&<div className="field"><label>Bemerkungen</label><div className="ro-val" style={{whiteSpace:"pre-wrap"}}>{deriveNoteText(notes)}</div></div>}
      {(kontaktName||kontaktTel||kontaktMail)&&<div className="notify-box" style={{marginBottom:14}}>
        <div style={{fontWeight:600,fontSize:12.5,marginBottom:6}}>Ansprechpartner vor Ort</div>
        <div className="ro-val">{kontaktName||"—"}</div>
        <div className="flex wrap" style={{gap:8,marginTop:6}}>
          {kontaktTel.trim()&&<a className="btn ghost sm" href={"tel:"+kontaktTel.replace(/[^0-9+]/g,"")}>📞 {kontaktTel}</a>}
          {kontaktMail.trim()&&<a className="btn ghost sm" href={"mailto:"+kontaktMail.trim()}>✉️ {kontaktMail}</a>}</div></div>}
      <div className="notify-box">
        <div style={{fontWeight:600,fontSize:12.5,marginBottom:8}}>In Kalender speichern</div>
        <button className="btn sm" onClick={()=>downloadICS({title:"Technikereinsatz "+(autohaus||project?.name||""),date:ctx.date,allDay,startTime,endTime,
          location:adresse,description:[dauer?("Dauer: "+dauer):"",vehicles.filter(v=>v.kennzeichen||v.vin).length+" Fahrzeug(e)",deriveNoteText(notes)].filter(Boolean).join("\n"),

    </>:<>
    <div className="row2">

          <button type="button" className="btn ghost sm" style={{marginLeft:6}} onClick={()=>setProjectNr("")}>ändern</button></div>}
        {!pickedProject&&<div className="diffcol" style={{marginTop:6,maxHeight:160,overflow:"auto"}}>

            <span style={{fontWeight:600}}>{p.alias?p.alias+" ":""}{p.name}</span><span className="muted mini">Nr. {p.nr}</span>
            <span className="spacer"></span><span className={"badge "+(STATUS_COLORS[p.status]||"b-gray")}>{p.status}</span></div>))}
          {projFiltered.length===0&&<div className="muted mini" style={{padding:8}}>Keine Projekte gefunden.</div>}</div>}</div>
      <div className="field"><label>Autohaus</label><input value={autohaus} onChange={e=>setAutohaus(e.target.value)} placeholder="Name des Autohauses"/></div></div>
    <div className="row2">
      <div className="field"><label>Adresse des Autohauses</label><input value={adresse} onChange={e=>setAdresse(e.target.value)} placeholder="Straße Hausnr, PLZ Ort"/>
        {adresse.trim()&&<a href={mapsLink(adresse)} target="_blank" rel="noopener" className="btn ghost sm" style={{marginTop:6}}><Ic d={ICONS.pin}/> Route öffnen</a>}</div>
      <div className="field"><label>Versicherung</label>
        <select value={versicherung} onChange={e=>setVersicherung(e.target.value)}>

    <div className="row2"><div className="field"><label>Von (Datum){ed?" – verschiebt den Termin":""}</label>
        <input type="date" value={fromDate} onChange={e=>{setFromDate(e.target.value);if(e.target.value>toDate)setToDate(e.target.value);}}/></div>
      <div className="field"><label>Bis (optional, mehrere Tage – z. B. Mo–Mi)</label><input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}/></div></div>
    <div className="row2">
      <div className="field"><label>Zeit</label>
        <div className="pill-tabs" style={{marginBottom:allDay?0:8}}>
          <button className={allDay?"active":""} onClick={()=>setAllDay(true)}>Ganzer Tag</button>
          <button className={!allDay?"active":""} onClick={()=>setAllDay(false)}>Uhrzeit</button></div>
        {!allDay&&<div className="row2"><input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)}/>
          <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)}/></div>}</div>
      <div className="field"><label>Einsatzdauer (optional)</label><input value={dauer} onChange={e=>setDauer(e.target.value)} placeholder="z. B. 2 Tage / 6 Std"/></div></div>

    <div className="field"><label>Fahrzeuge (Kennzeichen und/oder VIN je Fahrzeug · AW erwartet) · Σ {fmtAW(totalAW)} AW</label>
      {vehicles.map((v,i)=>(<div key={i} className="flex" style={{gap:6,marginBottom:6,alignItems:"center"}}>
        <input placeholder="Kennzeichen" value={v.kennzeichen} onChange={e=>setVeh(i,{kennzeichen:e.target.value})} style={{flex:"1 1 120px"}}/>
        <input placeholder="VIN / Fahrgestellnr" value={v.vin} onChange={e=>setVeh(i,{vin:e.target.value})} style={{flex:"2 1 160px"}}/>
        <input type="number" placeholder="AW" value={v.aw} onChange={e=>setVeh(i,{aw:e.target.value})} style={{width:80}}/>
        <input type="number" placeholder="AW erl." title="tatsächlich erledigte AW" value={v.awDone} onChange={e=>setVeh(i,{awDone:e.target.value})} style={{width:80}}/>
        <button className="btn ghost sm" onClick={()=>rmVeh(i)} title="Fahrzeug entfernen" disabled={vehicles.length===1}><Ic d={ICONS.x}/></button>
      </div>))}
      <button className="btn sm" onClick={addVeh}><Ic d={ICONS.plus}/> Fahrzeug hinzufügen</button></div>

    <NotesEditor notes={notes} setNotes={setNotes} store={store} label="Bemerkungen"/>

    <div className="notify-box" style={{marginBottom:14}}>
      <div className="flex" style={{marginBottom:8}}>
        <div style={{fontWeight:600,fontSize:12.5}}>Ansprechpartner vor Ort (optional)</div>
        <span className="spacer"></span>
        {pickedProject&&(pickedProject.kontaktName||pickedProject.kontaktTel||pickedProject.kontaktMail)&&
          <button type="button" className="btn ghost sm" onClick={()=>{setKontaktName(pickedProject.kontaktName||"");setKontaktTel(pickedProject.kontaktTel||"");setKontaktMail(pickedProject.kontaktMail||"");}}>Aus Projekt übernehmen</button>}
      </div>
      <div className="row3">
        <div className="field"><label>Name</label><input value={kontaktName} onChange={e=>setKontaktName(e.target.value)} placeholder="Vor- und Nachname"/></div>
        <div className="field"><label>Telefon</label><input type="tel" value={kontaktTel} onChange={e=>setKontaktTel(e.target.value)} placeholder="z. B. 0170 1234567"/></div>
        <div className="field"><label>E-Mail</label><input type="email" value={kontaktMail} onChange={e=>setKontaktMail(e.target.value)} placeholder="name@firma.de"/></div></div>
      {(kontaktTel.trim()||kontaktMail.trim())&&<div className="flex wrap" style={{gap:8,marginTop:2}}>
        {kontaktTel.trim()&&<a className="btn ghost sm" href={"tel:"+kontaktTel.replace(/[^0-9+]/g,"")}>📞 Anrufen</a>}
        {kontaktMail.trim()&&<a className="btn ghost sm" href={"mailto:"+kontaktMail.trim()}>✉️ E-Mail</a>}</div>}
      {pickedProject&&<div className="mini muted" style={{marginTop:6}}>Wird beim Speichern automatisch mit dem Projekt synchronisiert.</div>}</div>

    {ed&&<div className="notify-box" style={{marginBottom:14}}>
      <div style={{fontWeight:600,fontSize:12.5,marginBottom:8}}>In Kalender speichern</div>
      <button className="btn sm" onClick={()=>downloadICS({title:"Technikereinsatz "+(autohaus||project?.name||""),date:ctx.date,allDay,startTime,endTime,
        location:adresse,description:[versicherung?("Versicherung: "+versicherung):"",dauer?("Dauer: "+dauer):"",base.vehicles.length?(base.vehicles.length+" Fahrzeug(e), Σ "+fmtAW(totalAW)+" AW"):"",deriveNoteText(notes)].filter(Boolean).join("\n"),
        contactName:kontaktName,contactTel:kontaktTel,contactMail:kontaktMail})}>
        <Ic d={ICONS.week}/> Termin herunterladen (.ics)</button>
      <div className="mini muted" style={{marginTop:7}}>Öffnet sich in Outlook, Apple Kalender oder Google Kalender.</div></div>}

    <div className="notify-box">
      <div style={{fontWeight:600,fontSize:12.5,marginBottom:8}}>Einsatz an Techniker senden</div>
      {!ed&&<div className="mini muted" style={{marginBottom:8}}>Zum Protokollieren des Versands bitte zuerst „Anlegen". Danach erscheint hier die Versandhistorie.</div>}
      <div className="flex wrap">
        <a className="btn green sm" href={hasPhone?waLink(emp.phone,sendMsg):undefined} target="_blank" rel="noopener" onClick={()=>onSend("WhatsApp")}
           style={hasPhone?{}:{opacity:.5,pointerEvents:"none"}}><Ic d={ICONS.wa}/> WhatsApp</a>
        <a className="btn primary sm" href={emp?.email?mailLink(emp.email,subj,sendMsg):undefined} onClick={()=>onSend("E-Mail")}
           style={emp?.email?{}:{opacity:.5,pointerEvents:"none"}}><Ic d={ICONS.mail}/> E-Mail (Outlook)</a>
        {adresse.trim()&&<a className="btn sm" href={mapsLink(adresse)} target="_blank" rel="noopener"><Ic d={ICONS.pin}/> Route</a>}
      </div>
      {ed&&(ed.sendLog||[]).length>0&&<div style={{marginTop:10}}>
        <div className="mini" style={{fontWeight:600,marginBottom:4}}>Versandhistorie</div>
        {ed.sendLog.slice().reverse().map((s,i)=>(<div key={i} className="mini muted">{fmtDE(s.ts.slice(0,10))} – {s.ts.slice(11,16)} Uhr · {s.channel} versendet{s.by?" ("+shortCreator(s.by)+")":""}</div>))}
      </div>}
    </div>
    </>)}
  </Modal>);
}

/* ============ PDF generators ============ */
function ensurePDF(){if(!window.jspdf){alert("PDF-Bibliothek nicht geladen (Internet nötig).");return null;}return window.jspdf.jsPDF;}
function generateWeekPDF(employees,assignments,projects,wk,yr,days,pdfFields){
  const JsPDF=ensurePDF();if(!JsPDF)return;const dn=d=>DAYNAMES[(d.getDay()+6)%7];
  const doc=new JsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  doc.setFontSize(14);doc.text("Wochenplan KW "+wk+" / "+yr,14,14);
  doc.setFontSize(9);doc.setTextColor(120);doc.text(fmtDE(ymd(days[0]))+" – "+fmtDE(ymd(days[days.length-1])),14,20);
  const head=[["Mitarbeiter",...days.map(d=>dn(d)+" "+fmtDEShort(d))]];
  const body=employees.map(e=>{const row=[e.name];
    days.forEach(d=>{const date=ymd(d);const items=assignments.filter(a=>a.employeeId===e.id&&a.date===date);
      row.push(items.map(a=>assignmentPdfLines(a,projects,pdfFields).join("\n")).join("\n\n"));});
    return row;});
  doc.autoTable({head,body,startY:24,styles:{fontSize:7,cellPadding:1.5,valign:"top",overflow:"linebreak"},
    headStyles:{fillColor:[37,99,235],fontSize:7.5},columnStyles:{0:{fontStyle:"bold",cellWidth:30}},
    theme:"grid",margin:{left:8,right:8}});
  doc.save("Wochenplan_KW"+wk+"_"+yr+".pdf");
}
function generatePersonPDF(emp,items,projects,days,wk,yr,appUrl,pdfFields){
  const JsPDF=ensurePDF();if(!JsPDF)return;const dn=d=>DAYNAMES[(d.getDay()+6)%7];
  const doc=new JsPDF({unit:"mm",format:"a4"});
  doc.setFontSize(15);doc.text("Einsatzplan · "+emp.name,14,16);
  doc.setFontSize(10);doc.setTextColor(120);doc.text("KW "+wk+" / "+yr+"  ("+fmtDE(ymd(days[0]))+" – "+fmtDE(ymd(days[days.length-1]))+")",14,23);
  doc.setTextColor(20);
  const body=[];
  days.forEach((d,i)=>{const date=ymd(d);const dayItems=sortByTime(items.filter(a=>a.date===date));
    if(!dayItems.length){body.push([dn(d)+" "+fmtDEShort(d),"—"]);return;}
    dayItems.forEach((a,idx)=>{const cell=assignmentPdfLines(a,projects,pdfFields).join("\n");
      body.push([idx===0?dn(d)+" "+fmtDEShort(d):"",cell]);});});
  doc.autoTable({head:[["Tag","Einsatz"]],body,startY:28,styles:{fontSize:9,cellPadding:2.5,valign:"top",overflow:"linebreak"},
    headStyles:{fillColor:[37,99,235]},columnStyles:{0:{fontStyle:"bold",cellWidth:26}},theme:"grid",margin:{left:12,right:12}});
  let y=doc.lastAutoTable.finalY+10;
  if(appUrl){doc.setFontSize(9);doc.setTextColor(37,99,235);doc.text("Aktueller Plan online: "+appUrl,14,y);}
  doc.save("Einsatzplan_"+emp.name.replace(/[^a-zA-Z0-9]/g,"_")+"_KW"+wk+".pdf");
}

/* ============ PROJEKTE ============ */
const PLANNED_STATUS=["Vorbereitung"];
function RoleBar({project,assignments,employees}){
  const roles=computeRoles(project,assignments,employees);
  return(<div className="flex" style={{gap:4}}>{PROJEKTROLLEN.map(r=>{const info=roles[r];const on=!!info;
    return(<span key={r} title={r+(info?": "+info.name+(info.date?" ("+fmtDE(info.date)+")":"")+(info.source==="manuell"?" · manuell":""):" – offen")}
      style={{width:22,height:22,borderRadius:6,display:"inline-flex",alignItems:"center",justifyContent:"center",
        fontSize:11,fontWeight:700,background:on?"var(--green)":"#e2e8f0",color:on?"#fff":"#94a3b8"}}>{ROLLE_KUERZEL[r]}</span>);})}</div>);
}
function Projekte({store}){
  const{projects,typen,api,versicherungen,assignments,techAssignments,employees,can}=store;
  const mayCreate=can("proj_create"),mayEdit=can("proj_edit"),mayDelete=can("proj_delete");
  const[q,setQ]=useState("");const[view,setView]=useState("alle");const[fTyp,setFTyp]=useState("");const[fVers,setFVers]=useState("");
  const[edit,setEdit]=useState(null);const[importOpen,setImportOpen]=useState(false);
  const versColor=name=>{const v=(versicherungen||[]).find(x=>x.name===name);return v?v.color:null;};
  const plannedFor=p=>{const m=new Map();
    assignments.filter(a=>(a.projectNrs||[]).includes(p.nr)&&a.date>=todayYMD).forEach(a=>{const e=employees.find(x=>x.id===a.employeeId);if(e)m.set(e.id,e);});
    techAssignments.filter(t=>t.projectNr===p.nr&&t.date>=todayYMD).forEach(t=>{const e=employees.find(x=>x.id===t.employeeId);if(e)m.set(e.id,e);});
    return[...m.values()];};
  const filtered=projects.filter(p=>(!q||p.name.toLowerCase().includes(q.toLowerCase())||(p.alias||"").toLowerCase().includes(q.toLowerCase())||p.nr.includes(q))&&
    (view==="alle"||(view==="aktiv"&&isActiveProject(p))||(view==="geplant"&&PLANNED_STATUS.includes(p.status)))&&

      <select style={{width:"auto"}} value={fTyp} onChange={e=>setFTyp(e.target.value)}><option value="">Alle Typen</option>{typen.map(t=><option key={t}>{t}</option>)}</select>
      <select style={{width:"auto"}} value={fVers} onChange={e=>setFVers(e.target.value)}><option value="">Alle Versicherungen</option>{(versicherungen||[]).map(v=><option key={v.name}>{v.name}</option>)}</select>
      <span className="spacer"></span><span className="mini muted">{filtered.length} / {projects.length}</span>
      {mayCreate&&<button className="btn" onClick={()=>setImportOpen(true)}><Ic d={ICONS.imp}/> Excel importieren</button>}
      {mayCreate&&<button className="btn primary" onClick={()=>setEdit({})}><Ic d={ICONS.plus}/> Neues Projekt</button>}
    </div>
    <div className="tbl-wrap"><table><thead><tr>
      <th>Nr</th><th>Projektname</th><th>Alias</th><th>Typ</th><th>Versich.</th><th>Planung (E·B·P·T·M)</th>
      <th>Eingeplant</th><th style={{width:110}}>Fortschritt</th><th>Status</th><th></th></tr></thead><tbody>
      {filtered.map(p=>{const vc=versColor(p.versicherung);const stand=effectiveStandort(p);const planned=plannedFor(p);
        return(<tr key={p.nr} className={mayEdit?"clickrow":""} onClick={mayEdit?(()=>setEdit(p)):undefined} title={mayEdit?"Zum Bearbeiten klicken":""}>
        <td style={{fontWeight:600}}>{p.nr}</td>
        <td><span className="flex" style={{gap:7}}>{vc&&<span className="dot" style={{background:vc}} title={p.versicherung}></span>}{p.name}</span>
          <div className="flex wrap" style={{gap:4,marginTop:3}}>
            {(p.fahrzeugarten||[]).map(fa=><span key={fa} className="badge b-gray" style={{fontSize:10}}>{fa}</span>)}
            {stand==="ausland"&&<span className="badge b-teal" style={{fontSize:10}}>Ausland</span>}
            {p.remote&&<span className="badge b-violet" style={{fontSize:10}}>Remote</span>}</div></td>
        <td>{p.alias?<span className="badge b-blue">{p.alias}</span>:<span className="muted">—</span>}</td>
        <td><span className="badge b-gray">{p.typ}</span></td>
        <td className="mini">{p.versicherung||<span className="muted">—</span>}</td>
        <td><RoleBar project={p} assignments={assignments} employees={employees}/></td>
        <td className="mini">{planned.length===0?<span className="muted">—</span>:
          <span className="flex wrap" style={{gap:4}}>{planned.slice(0,3).map(e=><span key={e.id} className="badge b-blue" style={{fontSize:10}} title={e.name}>{shortName(e.name)}</span>)}
            {planned.length>3&&<span className="badge b-gray" style={{fontSize:10}}>+{planned.length-3}</span>}</span>}</td>
        <td><div className="flex"><div className="progress"><div style={{width:Math.round((p.fortschritt||0)*100)+"%"}}></div></div>
          <span className="mini">{Math.round((p.fortschritt||0)*100)}%</span></div></td>
        <td><span className={"badge "+(STATUS_COLORS[p.status]||"b-gray")}>{p.status}</span></td>
        <td onClick={e=>e.stopPropagation()}><div className="flex">
          {mayEdit&&<button className="btn sm" onClick={()=>setEdit(p)} title="Bearbeiten"><Ic d={ICONS.edit}/> Bearbeiten</button>}
          {mayDelete&&<button className="btn ghost sm" onClick={()=>delProj(p.nr)} title="Löschen"><Ic d={ICONS.trash}/></button>}
          {!mayEdit&&!mayDelete&&<span className="muted mini">—</span>}</div></td></tr>);})}
      {filtered.length===0&&<tr><td colSpan="10"><div className="empty"><div className="big">Keine Projekte</div>
        <div>Lege eins an oder lade die Startdaten in den Einstellungen.</div></div></td></tr>}
    </tbody></table></div>
    {edit&&<ProjectEdit store={store} proj={edit} onClose={()=>setEdit(null)}/>}
    {importOpen&&<ImportModal store={store} onClose={()=>setImportOpen(false)}/>}
  </div>);
}

function ProjectEdit({store,proj,onClose}){
  const{projects,typen,api,versicherungen,assignments,employees}=store;const isNew=!proj.nr;
  const[f,setF]=useState({nr:proj.nr||"",name:proj.name||"",alias:proj.alias||"",typ:proj.typ||typen[0]||"",
    leiter:(proj.leiter||[]).join("\n"),adresse:proj.adresse||"",startdatum:proj.startdatum||"",enddatum:proj.enddatum||"",
    fortschritt:proj.fortschritt!=null?Math.round(proj.fortschritt*100):0,status:proj.status||"Vorbereitung",
    versicherung:proj.versicherung||"",standort:proj.standort||"auto",
    kontaktName:proj.kontaktName||"",kontaktTel:proj.kontaktTel||"",kontaktMail:proj.kontaktMail||"",
    gesellschaft:proj.gesellschaft||"DRS Hagelschaden",umsatz:proj.umsatz||0,technikerkosten:proj.technikerkosten||0});

  const[histOpen,setHistOpen]=useState("");
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  const setRolle=(r,patch)=>setRollen(o=>({...o,[r]:{...(o[r]||{}),...patch}}));
  const toggleFA=code=>setFahrzeugarten(a=>a.includes(code)?a.filter(x=>x!==code):[...a,code]);
  const derived=isNew?{}:computeRoles({...proj,rollen},assignments,employees);
  const allStatus=["Vorbereitung","Begutachtung","Reparatur","Finance","Beendet","fiktiv"];
  const autoStand=detectStandort(f.adresse);
  async function submit(){
    if(!f.nr.trim()){store.showToast("Projekt-Nr erforderlich");return;}
    if(isNew&&projects.some(p=>p.nr===f.nr.trim())){store.showToast("Nr existiert bereits");return;}
    const rec={...proj,nr:f.nr.trim(),name:f.name.trim(),alias:f.alias.trim(),typ:f.typ,adresse:f.adresse.trim(),
      versicherung:f.versicherung,rollen,fahrzeugarten,remote,standort:f.standort,
      kontaktName:f.kontaktName.trim(),kontaktTel:f.kontaktTel.trim(),kontaktMail:f.kontaktMail.trim(),
      leiter:f.leiter.split("\n").map(x=>x.trim()).filter(Boolean),startdatum:f.startdatum||null,enddatum:f.enddatum||null,
      fortschritt:(parseFloat(f.fortschritt)||0)/100,status:f.status,gesellschaft:f.gesellschaft,
      umsatz:parseFloat(f.umsatz)||0,technikerkosten:parseFloat(f.technikerkosten)||0};
    if(await api.saveProject(rec,isNew))onClose();}
  return(<Modal title={isNew?"Neues Projekt":"Projekt bearbeiten"} onClose={onClose} wide
    footer={<><button className="btn" onClick={onClose}>Abbrechen</button><button className="btn primary" onClick={submit}>{isNew?"Anlegen":"Speichern"}</button></>}>
    <div className="row2">
      <div className="field"><label>Projekt-Nr</label><input value={f.nr} onChange={e=>set("nr",e.target.value)} disabled={!isNew}/></div>
      <div className="field"><label>Gesellschaft</label><input value={f.gesellschaft} onChange={e=>set("gesellschaft",e.target.value)}/></div></div>
    <div className="field"><label>Projektname</label><input value={f.name} onChange={e=>set("name",e.target.value)}/></div>
    <div className="row2">
      <div className="field"><label>Alias / Kurzname (für Wochenplan)</label><input value={f.alias} onChange={e=>set("alias",e.target.value)} placeholder="z. B. „Senger Rheine"/></div>
      <div className="field"><label>Projekttyp</label><select value={f.typ} onChange={e=>set("typ",e.target.value)}>{typen.map(t=><option key={t}>{t}</option>)}</select></div></div>
    <div className="row2">

          <option value="">— keine —</option>{(versicherungen||[]).map(v=><option key={v.name}>{v.name}</option>)}</select></div>
      <div className="field"><label>Adresse (für Google-Maps-Link)</label>
        <input value={f.adresse} onChange={e=>set("adresse",e.target.value)} placeholder="Straße Hausnr, PLZ Ort"/></div></div>
    <div className="notify-box" style={{marginBottom:14}}>
      <div style={{fontWeight:600,fontSize:12.5,marginBottom:8}}>Ansprechpartner vor Ort</div>
      <div className="row3">
        <div className="field"><label>Name</label><input value={f.kontaktName} onChange={e=>set("kontaktName",e.target.value)} placeholder="Vor- und Nachname"/></div>
        <div className="field"><label>Telefon</label><input type="tel" value={f.kontaktTel} onChange={e=>set("kontaktTel",e.target.value)} placeholder="z. B. 0170 1234567"/></div>
        <div className="field"><label>E-Mail</label><input type="email" value={f.kontaktMail} onChange={e=>set("kontaktMail",e.target.value)} placeholder="name@firma.de"/></div></div>
      <div className="mini muted" style={{marginTop:6}}>Wird bei der Einsatz-/Technikerplanung automatisch vorgeschlagen und bei Änderungen dort synchronisiert.</div></div>
    <div className="row2">
      <div className="field"><label>Fahrzeugarten (Mehrfachauswahl)</label>
        <div className="flex wrap" style={{gap:8}}>{FAHRZEUGARTEN.map(([code,label])=>{const on=fahrzeugarten.includes(code);
          return(<button key={code} type="button" className={"btn sm"+(on?" primary":"")} onClick={()=>toggleFA(code)} title={label}>{on?"✓ ":""}{code}</button>);})}</div>
        <div className="mini muted" style={{marginTop:4}}>PK = Privatkunden · GW = Gebrauchtwagen · NW = Neuwagen</div></div>
      <div className="field"><label>Standort</label>

    <div className="row2">
      <div className="field"><label>Startdatum</label><input type="date" value={f.startdatum||""} onChange={e=>set("startdatum",e.target.value)}/></div>
      <div className="field"><label>Enddatum</label><input type="date" value={f.enddatum||""} onChange={e=>set("enddatum",e.target.value)}/></div></div>
    <div className="row2">
      <div className="field"><label>Projektstatus</label><select value={f.status} onChange={e=>set("status",e.target.value)}>{allStatus.map(s=><option key={s}>{s}</option>)}</select></div>
      <div className="field"><label>Fortschritt: {f.fortschritt}%</label><input type="range" min="0" max="100" value={f.fortschritt} onChange={e=>set("fortschritt",e.target.value)}/></div></div>

    <div className="field"><label>Planungsstatus / Rollen</label>
      <div className="mini muted" style={{marginBottom:8}}>Aus der Terminplanung übernommene Rollen (letzter Eintrag zählt) erscheinen automatisch. Zusätzlich kannst du je Rolle einen <b>erfassten Mitarbeiter auswählen</b> oder einen <b>freien Namen</b> eintragen (auch Personen, die nicht als Mitarbeiter angelegt sind).</div>
      <datalist id="proj-role-emps">{employees.map(e=><option key={e.id} value={e.name}/>)}</datalist>
      {PROJEKTROLLEN.map(r=>{const d=derived[r];const man=rollen[r]||{};const fromTermin=d&&d.source==="termin";
        return(<div key={r} style={{border:"1px solid var(--line)",borderRadius:8,padding:"8px 10px",marginBottom:6}}>
          <div className="flex" style={{gap:8}}>
            <span style={{width:22,height:22,borderRadius:6,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,background:(d||man.name||man.checked)?"var(--green)":"#e2e8f0",color:(d||man.name||man.checked)?"#fff":"#94a3b8"}}>{ROLLE_KUERZEL[r]}</span>
            <b style={{minWidth:110}}>{r}</b>
            {fromTermin?<span className="mini"><span className="badge b-green">{shortName(d.name)}</span> <span className="muted">aktuell · {fmtDE(d.date)} · aus Termin</span></span>:
              <label className="flex mini" style={{gap:6,cursor:"pointer"}}><input type="checkbox" style={{width:"auto"}} checked={!!man.checked} onChange={e=>setRolle(r,{checked:e.target.checked})}/> geplant</label>}
            <span className="spacer"></span>
            {fromTermin&&d.history.length>0&&<button type="button" className="btn ghost sm" onClick={()=>setHistOpen(h=>h===r?"":r)}>Historie ({d.history.length})</button>}
          </div>
          {!fromTermin&&<input list="proj-role-emps" style={{marginTop:6}} placeholder="Mitarbeiter auswählen oder Namen eintippen…" value={man.name||""} onChange={e=>setRolle(r,{name:e.target.value})}/>}

          {histOpen===r&&fromTermin&&<div className="diffcol" style={{marginTop:6}}>

      <textarea value={f.leiter} onChange={e=>set("leiter",e.target.value)} placeholder="Nachname, Vorname"/></div>
  </Modal>);

function ImportModal({store,onClose}){
  const{projects,api}=store;const[step,setStep]=useState(1);const[parsed,setParsed]=useState(null);
  const[sel,setSel]=useState({});const fileRef=useRef();const[busy,setBusy]=useState(false);
  function excelDate(v){if(v==null||v==="")return null;
    if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400000));return ymd(d);}
    const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
    m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m)return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");return null;}
  function num(v){if(v==null||v==="")return 0;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
  function handleFile(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let hi=-1;for(let i=0;i<Math.min(rows.length,12);i++){const r=rows[i].map(x=>String(x).toLowerCase());
        if(r.some(c=>c.includes("projektname"))||(r.includes("nr")&&r.some(c=>c.includes("typ")))){hi=i;break;}}
      if(hi<0)hi=0;const hdr=rows[hi].map(x=>String(x).trim().toLowerCase());
      const col=names=>{for(const n of names){const idx=hdr.findIndex(h=>h===n||h.includes(n));if(idx>=0)return idx;}return -1;};
      const c={nr:col(["nr"]),name:col(["projektname","name"]),typ:col(["projekttyp","typ"]),leiter:col(["projektleiter","leiter"]),
        start:col(["startdatum","start"]),end:col(["enddatum","ende"]),fort:col(["fortschritt"]),status:col(["projektstatus","status"]),
        ges:col(["gesellschaft"]),adr:col(["adresse"]),umsatz:col(["umsatz"]),tk:col(["technikerkosten"]),gesamt:col(["gesamt"])};
      const items=[];
      for(let i=hi+1;i<rows.length;i++){const r=rows[i];const nr=c.nr>=0?String(r[c.nr]).trim():"";
        if(!nr||nr==="undefined")continue;const nrClean=nr.replace(/\.0$/,"");
        let fort=c.fort>=0?num(r[c.fort]):0;if(fort>1)fort=fort/100;
        const cur=projects.find(p=>p.nr===nrClean);
        items.push({nr:nrClean,name:c.name>=0?String(r[c.name]).trim():"",alias:cur?cur.alias:"",typ:c.typ>=0?String(r[c.typ]).trim():"",
          leiter:c.leiter>=0?String(r[c.leiter]).split("\n").map(x=>x.trim()).filter(Boolean):[],
          adresse:c.adr>=0?String(r[c.adr]).trim():(cur?cur.adresse:""),
          versicherung:cur?cur.versicherung:"",rollen:cur?cur.rollen:{},
          fahrzeugarten:cur?cur.fahrzeugarten:[],remote:cur?cur.remote:false,standort:cur?cur.standort:"auto",
          kontaktName:cur?cur.kontaktName:"",kontaktTel:cur?cur.kontaktTel:"",kontaktMail:cur?cur.kontaktMail:"",
          startdatum:c.start>=0?excelDate(r[c.start]):null,enddatum:c.end>=0?excelDate(r[c.end]):null,
          fortschritt:fort,status:c.status>=0?String(r[c.status]).trim():"Vorbereitung",
          gesellschaft:c.ges>=0?String(r[c.ges]).trim():"",umsatz:c.umsatz>=0?num(r[c.umsatz]):0,
          technikerkosten:c.tk>=0?num(r[c.tk]):0,gesamt:c.gesamt>=0?num(r[c.gesamt]):0});}
      const existNrs=new Set(projects.map(p=>p.nr));const neu=items.filter(it=>!existNrs.has(it.nr));
      const update=items.filter(it=>{const cur=projects.find(p=>p.nr===it.nr);
        return cur&&(cur.status!==it.status||Math.abs((cur.fortschritt||0)-it.fortschritt)>0.001||cur.enddatum!==it.enddatum);});
      const unchanged=items.length-neu.length-update.length;
      const s={};neu.forEach(it=>s["n"+it.nr]=true);update.forEach(it=>s["u"+it.nr]=true);
      setSel(s);setParsed({items,neu,update,unchanged});setStep(2);
    }catch(err){store.showToast("Fehler beim Lesen: "+err.message);}};
    rd.readAsArrayBuffer(file);}
  async function apply(){setBusy(true);
    const newList=parsed.neu.filter(it=>sel["n"+it.nr]);const updList=parsed.update.filter(it=>sel["u"+it.nr]);
    const res=await api.upsertProjects(newList,updList);setBusy(false);
    if(res){store.showToast(res.add+" neu · "+res.upd+" aktualisiert");onClose();}}
  return(<Modal title="Excel-Import · Projektabgleich" onClose={onClose} xwide
    footer={step===2?<><button className="btn" onClick={()=>setStep(1)}>Zurück</button><span className="spacer"></span>
      <button className="btn primary" onClick={apply} disabled={busy}>{busy?"Speichern…":"Auswahl übernehmen"}</button></>:<button className="btn" onClick={onClose}>Schließen</button>}>
    {step===1&&<div>
      <p className="muted">Lade deine Projektliste (.xlsx). Spalten <b>Nr, Projektname, Typ, Leiter, Adresse, Start-/Enddatum, Fortschritt, Status</b> werden automatisch erkannt. Vorhandene Alias-Namen bleiben erhalten.</p>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}}/>
      <div onClick={()=>fileRef.current.click()} style={{border:"2px dashed var(--line2)",borderRadius:12,padding:"46px 20px",textAlign:"center",cursor:"pointer",background:"var(--panel2)"}}>
        <Ic d={ICONS.imp} style={{width:34,height:34,color:"var(--brand)",margin:"0 auto 10px"}}/>
        <div style={{fontWeight:600,fontSize:15}}>Excel-Datei auswählen</div>
        <div className="muted mini" style={{marginTop:4}}>Klicken zum Durchsuchen (.xlsx)</div></div></div>}
    {step===2&&parsed&&<div>
      <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)",marginBottom:16}}>
        <div className="stat"><div className="lbl">Neu</div><div className="val" style={{color:"var(--green)"}}>{parsed.neu.length}</div></div>
        <div className="stat"><div className="lbl">Geändert</div><div className="val" style={{color:"var(--amber)"}}>{parsed.update.length}</div></div>
        <div className="stat"><div className="lbl">Unverändert</div><div className="val muted">{parsed.unchanged}</div></div></div>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div><div className="flex" style={{marginBottom:8}}><b>Neue Projekte</b><span className="spacer"></span>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.neu.forEach(it=>s["n"+it.nr]=true);setSel(s);}}>Alle</button>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.neu.forEach(it=>s["n"+it.nr]=false);setSel(s);}}>Keine</button></div>
          <div className="diffcol">{parsed.neu.length===0&&<div className="muted mini" style={{padding:8}}>Keine neuen Projekte.</div>}
            {parsed.neu.map(it=>(<label key={it.nr} className="rec-row" style={{cursor:"pointer"}}>
              <input type="checkbox" style={{width:"auto"}} checked={!!sel["n"+it.nr]} onChange={e=>setSel(s=>({...s,["n"+it.nr]:e.target.checked}))}/>
              <span style={{fontWeight:600}}>{it.nr}</span><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{it.name}</span>
              <span className={"badge "+(STATUS_COLORS[it.status]||"b-gray")}>{it.status}</span></label>))}</div></div>
        <div><div className="flex" style={{marginBottom:8}}><b>Geänderte Projekte</b><span className="spacer"></span>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.update.forEach(it=>s["u"+it.nr]=true);setSel(s);}}>Alle</button>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.update.forEach(it=>s["u"+it.nr]=false);setSel(s);}}>Keine</button></div>
          <div className="diffcol">{parsed.update.length===0&&<div className="muted mini" style={{padding:8}}>Keine Änderungen.</div>}
            {parsed.update.map(it=>{const cur=projects.find(p=>p.nr===it.nr);

}

function Mitarbeiter({store}){

  const today=todayYMD;
  const isAbsentNow=id=>absences.some(a=>a.employeeId===id&&today>=a.von&&today<=a.bis);

    (fStatus===""||(fStatus==="gesperrt"&&e.gesperrt)||(fStatus==="abwesend"&&isAbsentNow(e.id))||(fStatus==="ausland"&&e.freigabe_ausland)||(fStatus==="aktiv"&&!e.gesperrt)));

        <input style={{paddingLeft:32}} placeholder="Suche Name / Rolle…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <select style={{width:"auto"}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
        <option value="">Alle</option><option value="aktiv">Nicht gesperrt</option><option value="gesperrt">Gesperrt</option>
        <option value="abwesend">Aktuell abwesend</option><option value="ausland">Auslandsfreigabe</option></select>
      <span className="spacer"></span><span className="mini muted">{filtered.length} Mitarbeiter</span>
      {mayEdit&&<button className="btn primary" onClick={()=>setEdit({})}><Ic d={ICONS.plus}/> Neuer Mitarbeiter</button>}</div>
    <div className="tbl-wrap"><table><thead><tr><th>Name</th><th>Rolle</th><th>Status</th><th>Reisepass</th><th>E-Mail</th><th>Telefon</th><th></th></tr></thead><tbody>
      {filtered.map(e=>{const pw=passWarnDays(e.pass_gueltig);const absent=isAbsentNow(e.id);
        return(<tr key={e.id} className={mayEdit?"clickrow":""} onClick={mayEdit?(()=>setEdit(e)):undefined} title={mayEdit?"Zum Bearbeiten klicken":""}>
        <td style={{fontWeight:600}}>{e.name}</td><td><span className="badge b-blue">{e.role||"–"}</span></td>
        <td><div className="flex wrap" style={{gap:4}}>

          {absent&&<span className="badge b-amber">Abwesend</span>}
          {e.freigabe_ausland?<span className="badge b-teal">Ausland ✓</span>:<span className="badge b-gray">nur Inland</span>}
          {!e.gesperrt&&!absent&&!e.freigabe_ausland&&<span className="muted mini">—</span>}</div></td>
        <td className="mini">{e.pass_gueltig?<span className={pw!=null&&pw<90?(pw<0?"badge b-red":"badge b-amber"):""}>{fmtDE(e.pass_gueltig)}{pw!=null&&pw<90&&pw>=0?" ("+pw+"T)":pw<0?" abgel.":""}</span>:<span className="muted">—</span>}</td>
        <td className="mini">{e.email||<span className="muted">—</span>}</td><td className="mini">{e.phone||<span className="muted">—</span>}</td>
        <td onClick={ev=>ev.stopPropagation()}><div className="flex">
          {mayEdit?<><button className="btn sm" onClick={()=>setEdit(e)} title="Bearbeiten"><Ic d={ICONS.edit}/> Bearbeiten</button>
          <button className="btn ghost sm" onClick={()=>delEmp(e.id)} title="Löschen"><Ic d={ICONS.trash}/></button></>:<span className="muted mini">—</span>}</div></td></tr>);})}

function EmpLogbook({store,empId}){
  const{assignments,techAssignments,projects}=store;
  const rows=[];
  assignments.filter(a=>a.employeeId===empId).forEach(a=>{const ps=assignmentProjects(a,projects);
    rows.push({date:a.date,art:a.type==="frei"?"Freier Termin":"Projekteinsatz",
      projekt:a.type==="frei"?(a.title||"Frei"):(ps.map(p=>p.name).join(", ")||"—"),
      adresse:ps.map(p=>p.adresse).filter(Boolean)[0]||a.adresse||"",
      rolle:a.projektrolle||a.einsatz||"",ort:a.ort});});
  techAssignments.filter(t=>t.employeeId===empId).forEach(t=>{const p=projects.find(x=>x.nr===t.projectNr);
    rows.push({date:t.date,art:"Technikereinsatz",projekt:t.autohaus||(p?p.name:"—"),adresse:t.adresse||"",
      rolle:(t.vehicles||[]).length+" Fzg · "+fmtAW(awSum(t))+" AW",ort:"inland"});});
  rows.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  if(rows.length===0)return<div className="muted mini">Noch keine Einsätze erfasst.</div>;
  return(<div className="tbl-wrap" style={{maxHeight:280}}><table><thead><tr><th>Datum</th><th>Art</th><th>Projekt / Autohaus</th><th>Rolle/Tätigkeit</th><th>Adresse</th></tr></thead><tbody>
    {rows.slice(0,200).map((r,i)=>(<tr key={i}>
      <td className="mini" style={{whiteSpace:"nowrap"}}>{fmtDE(r.date)}</td>
      <td><span className="badge b-gray">{r.art}</span></td>
      <td className="mini">{r.projekt}{r.ort==="ausland"&&<span className="badge b-teal" style={{marginLeft:6}}>Ausland</span>}</td>
      <td className="mini">{r.rolle||"—"}</td>
      <td className="mini">{r.adresse?<a href={mapsLink(r.adresse)} target="_blank" rel="noopener">{r.adresse}</a>:<span className="muted">—</span>}</td></tr>))}
  </tbody></table></div>);
}

function UserEdit({store,user,onClose}){

  function togglePerm(k){setF(o=>({...o,permissions:{...eff,[k]:!eff[k]}}));}

      {adv&&<div className="diffcol" style={{marginTop:8}}>

  const shortUA=ua=>{if(!ua)return"—";let s=ua;const m=ua.match(/(Chrome|Firefox|Safari|Edg|OPR)\/[\d.]+/);const os=ua.match(/\(([^)]+)\)/);return (m?m[0]:s.slice(0,30))+(os?" · "+os[1].split(";")[0]:"");};
  return(<div>
    <h2 className="ttl">Protokolle</h2><div className="sub">Änderungsprotokoll &amp; Login-Logbuch</div>
    <div className="pill-tabs" style={{marginBottom:14}}>
      <button className={view==="changes"?"active":""} onClick={()=>setView("changes")}>Änderungsprotokoll</button>
      <button className={view==="logins"?"active":""} onClick={()=>setView("logins")}>Login-Logbuch</button></div>
    {view==="changes"?
      <div className="tbl-wrap"><table><thead><tr><th style={{width:150}}>Zeitpunkt</th><th>Benutzer</th><th>Aktion</th><th>Details</th></tr></thead><tbody>
        {changeLog.length===0&&<tr><td colSpan="4"><div className="empty"><div className="big">Noch keine Einträge</div></div></td></tr>}
        {changeLog.map(r=>(<tr key={r.id}><td className="mini" style={{whiteSpace:"nowrap"}}>{fmtTs(r.ts)}</td>
          <td className="mini">{r.user_email||"—"}</td><td><span className="badge b-gray">{r.action}</span></td>
          <td className="mini">{r.details||"—"}</td></tr>))}
      </tbody></table></div>
      :
      <div className="tbl-wrap"><table><thead><tr><th style={{width:150}}>Zeitpunkt</th><th>Benutzer</th><th>Gerät / Browser</th></tr></thead><tbody>
        {loginLog.length===0&&<tr><td colSpan="3"><div className="empty"><div className="big">Noch keine Anmeldungen protokolliert</div></div></td></tr>}
        {loginLog.map(r=>(<tr key={r.id}><td className="mini" style={{whiteSpace:"nowrap"}}>{fmtTs(r.ts)}</td>
          <td className="mini">{r.email||"—"}</td><td className="mini">{shortUA(r.user_agent)}</td></tr>))}
      </tbody></table></div>}
  </div>);
}

/* ============ STATISTIK ============ */
function Statistik({store}){
  const{employees,assignments}=store;
  const rows=employees.map(e=>{const mine=assignments.filter(a=>a.employeeId===e.id);
    return{e,total:mine.length,inland:mine.filter(a=>a.ort!=="ausland").length,ausland:mine.filter(a=>a.ort==="ausland").length};})
    .filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  const maxT=Math.max(1,...rows.map(r=>r.total));
  const totalEins=assignments.length;const totalAusland=assignments.filter(a=>a.ort==="ausland").length;const totalFrei=assignments.filter(a=>a.type==="frei").length;
  const byStatus={};assignments.filter(a=>a.type==="project"&&a.einsatz).forEach(a=>byStatus[a.einsatz]=(byStatus[a.einsatz]||0)+1);
  const statusRows=Object.entries(byStatus).sort((a,b)=>b[1]-a[1]);const maxS=Math.max(1,...statusRows.map(r=>r[1]));
  return(<div>
    <h2 className="ttl">Statistik</h2><div className="sub">Einsätze der Mitarbeiter – In- &amp; Ausland</div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",marginBottom:20}}>
      <div className="stat"><div className="lbl">Einsätze gesamt</div><div className="val">{totalEins}</div></div>
      <div className="stat"><div className="lbl">Inland</div><div className="val" style={{color:"var(--brand)"}}>{totalEins-totalAusland}</div></div>
      <div className="stat"><div className="lbl">Ausland</div><div className="val" style={{color:"var(--teal)"}}>{totalAusland}</div><div className="foot">✈ Auslandseinsätze</div></div>
      <div className="stat"><div className="lbl">Freie Termine</div><div className="val" style={{color:"var(--amber)"}}>{totalFrei}</div></div></div>
    {rows.length===0?<div className="card"><div className="empty"><div className="big">Noch keine Einsätze erfasst</div></div></div>:<>
    <div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Einsätze pro Mitarbeiter · In- &amp; Ausland</h3></div>
      <div className="card-b"><div className="legend"><span><span className="dot" style={{background:"var(--brand)"}}></span> Inland</span>
        <span><span className="dot" style={{background:"var(--teal)"}}></span> Ausland</span></div>
        {rows.map(r=>(<div key={r.e.id} className="bar-row"><div className="name">{r.e.name}</div>
          <div className="bar-track">{r.inland>0&&<div className="bar-seg" style={{background:"var(--brand)",width:(r.inland/maxT*100)+"%"}}>{r.inland}</div>}
            {r.ausland>0&&<div className="bar-seg" style={{background:"var(--teal)",width:(r.ausland/maxT*100)+"%"}}>{r.ausland}</div>}</div>
          <div style={{width:36,fontWeight:600,fontSize:12.5}}>{r.total}</div></div>))}</div></div>
    <div className="card"><div className="card-h"><h3>Einsätze nach Tätigkeit</h3></div><div className="card-b">
      {statusRows.length===0?<div className="muted mini">Keine Projekteinsätze erfasst.</div>:
      statusRows.map(([k,v])=>(<div key={k} className="bar-row"><div className="name">{k}</div>
        <div className="bar-track"><div className="bar-seg" style={{background:EINSATZ_COLORS[k]||"var(--violet)",width:(v/maxS*100)+"%"}}>{v}</div></div>
        <div style={{width:36,fontWeight:600,fontSize:12.5}}>{v}</div></div>))}</div></div></>}
  </div>);
}

/* ============ EINSTELLUNGEN ============ */
function ListEditor({title,desc,skey,items,api,showToast}){
  const[val,setVal]=useState("");
  function add(){const v=val.trim();if(!v)return;if(items.includes(v)){showToast("Existiert bereits");return;}api.setSetting(skey,[...items,v]);setVal("");}
  return(<div className="card" style={{marginBottom:18}}><div className="card-h"><h3>{title}</h3></div><div className="card-b">
    <p className="muted mini" style={{marginTop:0}}>{desc}</p>
    <div className="tag-list" style={{marginBottom:14}}>
      {items.map(it=>(<span key={it} className="tag">{it}<button onClick={()=>api.setSetting(skey,items.filter(x=>x!==it))} title="Entfernen">×</button></span>))}
      {items.length===0&&<span className="muted mini">Noch nichts angelegt.</span>}</div>
    <div className="flex"><input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}} placeholder="Neuen Eintrag hinzufügen…" style={{maxWidth:320}}/>
      <button className="btn primary sm" onClick={add}><Ic d={ICONS.plus}/> Hinzufügen</button></div></div></div>);
}
function WorkdaysEditor({workdays,api,showToast}){
  const names=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
  const cur=workdays&&workdays.length?workdays:DEFAULT_WORKDAYS;
  function toggle(i){let next=cur.includes(i)?cur.filter(x=>x!==i):[...cur,i];next=next.sort((a,b)=>a-b);
    if(next.length===0){showToast("Mindestens ein Tag nötig");return;}api.setSetting("workdays",next);}
  return(<div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Arbeitstage (Wochenplan)</h3></div><div className="card-b">
    <p className="muted mini" style={{marginTop:0}}>Welche Tage im Wochenplan angezeigt werden. Standard: Montag–Samstag (6-Tage-Woche).</p>
    <div className="flex wrap" style={{gap:8}}>{names.map((n,i)=>{const on=cur.includes(i);
      return(<button key={i} className={"btn sm"+(on?" primary":"")} onClick={()=>toggle(i)}>{on?"✓ ":""}{n}</button>);})}</div></div></div>);
}
function VersEditor({versicherungen,api,showToast}){
  const list=versicherungen||[];
  const[name,setName]=useState("");const[color,setColor]=useState("#2563eb");
  function add(){const v=name.trim();if(!v)return;if(list.some(x=>x.name.toLowerCase()===v.toLowerCase())){showToast("Existiert bereits");return;}
    api.setSetting("versicherungen",[...list,{name:v,color,active:true}]);setName("");}
  function update(i,patch){api.setSetting("versicherungen",list.map((x,idx)=>idx===i?{...x,...patch}:x));}
  function remove(i){api.setSetting("versicherungen",list.filter((_,idx)=>idx!==i));}
  return(<div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Versicherungen</h3></div><div className="card-b">
    <p className="muted mini" style={{marginTop:0}}>Versicherungen mit eigener Farbe. Die Farbe kennzeichnet alle Termine im Wochenplan. Deaktivierte erscheinen nicht mehr in den Auswahllisten, bleiben aber an bestehenden Projekten erhalten.</p>
    <div style={{marginBottom:12}}>{list.length===0&&<span className="muted mini">Noch keine Versicherung angelegt.</span>}
      {list.map((v,i)=>(<div key={i} className="flex" style={{gap:10,padding:"6px 0",borderBottom:"1px solid var(--line)"}}>
        <input type="color" value={v.color} onChange={e=>update(i,{color:e.target.value})} style={{width:44,height:32,padding:2}}/>
        <input value={v.name} onChange={e=>update(i,{name:e.target.value})} style={{maxWidth:220}}/>
        <span className="badge" style={{background:v.color,color:"#fff"}}>{v.name}</span>
        <span className="spacer"></span>
        <label className="flex mini" style={{gap:6,cursor:"pointer"}}><input type="checkbox" style={{width:"auto"}} checked={v.active!==false} onChange={e=>update(i,{active:e.target.checked})}/> aktiv</label>
        <button className="btn ghost sm" onClick={()=>remove(i)} title="Löschen"><Ic d={ICONS.trash}/></button></div>))}</div>
    <div className="flex" style={{gap:8}}>
      <input type="color" value={color} onChange={e=>setColor(e.target.value)} style={{width:44,height:38,padding:2}}/>
      <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Neue Versicherung…" style={{maxWidth:260}}/>
      <button className="btn primary sm" onClick={add}><Ic d={ICONS.plus}/> Hinzufügen</button></div></div></div>);
}
function RolePlanungEditor({roles,employees,rolePlanung,api,showToast}){
  const[nw,setNw]=useState("");
  const all=[...new Set([...(roles||[]),...employees.map(e=>e.role).filter(Boolean)])];
  function setRP(role,patch){const cur=planungFor(role,rolePlanung);
    const next={...(rolePlanung||{}),[role]:{...cur,...patch}};api.setSetting("role_planung",next);}
  function addRole(){const v=nw.trim();if(!v)return;if((roles||[]).some(r=>r.toLowerCase()===v.toLowerCase())){showToast("Rolle existiert bereits");setNw("");return;}
    api.setSetting("roles",[...(roles||[]),v]);setNw("");showToast("Rolle „"+v+"\" angelegt");}
  function delRole(r){const cnt=employees.filter(e=>e.role===r).length;
    if(cnt>0){if(!confirm("Der Rolle „"+r+"\" sind noch "+cnt+" Mitarbeiter zugeordnet. Rolle trotzdem aus der Liste entfernen? (Die Mitarbeiter behalten den Text, bis du sie umstellst.)"))return;}
    api.setSetting("roles",(roles||[]).filter(x=>x!==r));showToast("Rolle entfernt");}
  return(<div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Rollen &amp; Planzuordnung</h3></div><div className="card-b">
    <p className="muted mini" style={{marginTop:0}}>Lege Rollen an (z. B. Junior Projektleiter, Projektleiter, Techniker, Monteur) und bestimme je Rolle, in welchem Planer die Personen erscheinen – z. B. Techniker/Monteur in der Technikerplanung, Projektleiter in der Wochenplanung. Eine Rolle darf auch in beiden erscheinen.</p>
    <div className="flex" style={{gap:8,marginBottom:12}}>
      <input value={nw} onChange={e=>setNw(e.target.value)} placeholder="Neue Rolle, z. B. Junior Projektleiter" onKeyDown={e=>{if(e.key==="Enter")addRole();}} style={{maxWidth:300}}/>
      <button className="btn primary sm" onClick={addRole}><Ic d={ICONS.plus}/> Rolle hinzufügen</button></div>
    <div className="tbl-wrap"><table><thead><tr><th>Rolle</th><th style={{width:140,textAlign:"center"}}>Wochenplanung</th><th style={{width:150,textAlign:"center"}}>Technikerplanung</th><th style={{width:70}}></th></tr></thead><tbody>
      {all.map(r=>{const p=planungFor(r,rolePlanung);const cnt=employees.filter(e=>e.role===r).length;const inList=(roles||[]).includes(r);
        return(<tr key={r}><td><b>{r}</b> <span className="mini muted">· {cnt} MA{!inList&&<span title="nur bei Mitarbeitern vergeben, nicht in der Rollenliste"> · (nicht in Liste)</span>}</span></td>
          <td style={{textAlign:"center"}}><input type="checkbox" style={{width:"auto"}} checked={p.woche} onChange={e=>setRP(r,{woche:e.target.checked})}/></td>
          <td style={{textAlign:"center"}}><input type="checkbox" style={{width:"auto"}} checked={p.technik} onChange={e=>setRP(r,{technik:e.target.checked})}/></td>
          <td>{inList&&<button className="btn ghost sm" onClick={()=>delRole(r)} title="Rolle löschen"><Ic d={ICONS.trash}/></button>}</td></tr>);})}
      {all.length===0&&<tr><td colSpan="4" className="muted mini">Noch keine Rollen angelegt.</td></tr>}
    </tbody></table></div>
    <p className="mini muted" style={{marginTop:10,marginBottom:0}}>Ohne Häkchen gilt der Standard: Rollen mit „Techniker"/„Monteur" → Technikerplanung, alle anderen → Wochenplanung.</p>
  </div></div>);
}
function Einstellungen({store}){
  const{roles,einsatz,typen,appUrl,workdays,versicherungen,awCapacity,rolePlanung,pdfFields,api,showToast,employees,projects,assignments}=store;
  const[seeding,setSeeding]=useState(false);const[urlVal,setUrlVal]=useState(appUrl);const[copied,setCopied]=useState("");
  const[awVal,setAwVal]=useState(awCapacity||0);
  function exportData(){const data={employees,projects,assignments,roles,einsatz,typen,appUrl,workdays,versicherungen,exported:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="drs-personal-backup-"+todayYMD+".json";a.click();showToast("Backup heruntergeladen");}
  async function doSeed(){if(!confirm("Startdaten (163 Projekte, 34 Mitarbeiter) laden? Vorhandene Projekte mit gleicher Nr werden überschrieben."))return;
    setSeeding(true);await api.seed();setSeeding(false);}
  const empty=projects.length===0&&employees.length===0;
  const cp=t=>{navigator.clipboard.writeText(t);setCopied(t);setTimeout(()=>setCopied(""),1600);};
  return(<div>
    <h2 className="ttl">Einstellungen</h2><div className="sub">Arbeitstage, Versicherungen, Rollen, Status, Projekttypen, App-Link &amp; Daten · <b>Version {APP_VERSION}</b> ({APP_VERSION_DATE})</div>
    {empty&&<div className="card" style={{marginBottom:18,borderColor:"var(--brand)"}}><div className="card-b">
      <div className="flex" style={{alignItems:"flex-start"}}><Ic d={ICONS.db} style={{width:26,height:26,color:"var(--brand)",flexShrink:0}}/>
        <div><div style={{fontWeight:600,marginBottom:4}}>Datenbank ist leer</div>
          <p className="muted mini" style={{margin:"0 0 12px"}}>Lade die mitgelieferten Startdaten (163 Projekte + 34 Mitarbeiter) in Supabase.</p>
          <button className="btn primary" onClick={doSeed} disabled={seeding}>{seeding?"Lädt…":"Startdaten laden"}</button></div></div></div></div>}

    <WorkdaysEditor workdays={workdays} api={api} showToast={showToast}/>
    <div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Technikerplanung · Wochenkapazität (AW)</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>Optional: geplante AW pro Techniker und Woche als Kapazität. Damit zeigt die AW-Auslastung in der Technikerplanung Prozentwerte. 0 = aus.</p>
      <div className="flex"><input type="number" value={awVal} onChange={e=>setAwVal(e.target.value)} style={{maxWidth:160}} placeholder="z. B. 600"/>
        <button className="btn primary sm" onClick={()=>{api.setSetting("aw_capacity",Number(awVal)||0);showToast("Kapazität gespeichert");}}>Speichern</button></div></div></div>
    <VersEditor versicherungen={versicherungen} api={api} showToast={showToast}/>

    <div className="card" style={{marginBottom:18}}><div className="card-h"><h3>App-Link für Nachrichten</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>Die öffentliche Adresse dieser App (z. B. deine GitHub-Pages-URL). Sie wird in WhatsApp-/E-Mail-Nachrichten und PDF-Plänen mitgeschickt, damit Mitarbeiter bei Änderungen selbst reinschauen können.</p>
      <div className="flex"><input value={urlVal} onChange={e=>setUrlVal(e.target.value)} placeholder="https://deinname.github.io/personalplan/" style={{maxWidth:420}}/>
        <button className="btn primary sm" onClick={()=>{api.setSetting("app_url",urlVal.trim());showToast("App-Link gespeichert");}}>Speichern</button></div></div></div>

    <div className="card" style={{marginBottom:18}}><div className="card-h"><h3>PDF-Inhalt · Wochen- &amp; Mitarbeiterpläne</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>Lege fest, welche Angaben je Einsatz in den PDF-Plänen erscheinen. Gilt für den Wochenplan-PDF und die persönlichen Pläne beim Versand.</p>
      <div className="flex wrap" style={{gap:10}}>{PDF_FIELDS.map(([k,label])=>{const on=pdfFields[k]!==false;
        return(<label key={k} className="flex mini" style={{gap:7,cursor:"pointer",border:"1px solid "+(on?"var(--brand)":"var(--line)"),background:on?"var(--brand-l)":"#fff",borderRadius:8,padding:"8px 11px"}}>
          <input type="checkbox" style={{width:"auto"}} checked={on} onChange={e=>{api.setSetting("pdf_fields",{...pdfFields,[k]:e.target.checked});showToast("PDF-Einstellung gespeichert");}}/> {label}</label>);})}</div>
      <p className="mini muted" style={{marginTop:10,marginBottom:0}}>Kundenadresse = die im Projekt hinterlegte Adresse (bzw. bei freien Terminen die dort eingegebene). Auslandseinsätze werden immer gekennzeichnet.</p></div></div>

    <RolePlanungEditor roles={roles} employees={employees} rolePlanung={rolePlanung} api={api} showToast={showToast}/>
    <ListEditor title="Einsatzstatus / Tätigkeiten" desc="Was ein Mitarbeiter im Projekt macht (z. B. Begutachtung, Projektleitung)." skey="einsatz" items={einsatz} api={api} showToast={showToast}/>
    <ListEditor title="Projekttypen" desc="Kategorien für Projekte (z. B. Versicherungen, Hagelcover)." skey="typen" items={typen} api={api} showToast={showToast}/>

    <div className="card" style={{marginBottom:18}}><div className="card-h"><h3>Datenbank-Update (falls Spalten fehlen)</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>Wenn du von einer früheren Version kommst und Fehler zu fehlenden Spalten (z. B. „versicherung", „projektrolle") auftreten, führe dieses Skript einmalig im Supabase SQL-Editor aus:</p>
      <div className="sql-box">{MIGRATION_SQL}</div>
      <button className="btn sm" onClick={()=>cp(MIGRATION_SQL)}>{copied===MIGRATION_SQL?"Kopiert ✓":"Update-SQL kopieren"}</button></div></div>

    <div className="card"><div className="card-h"><h3>Daten &amp; Backup</h3></div><div className="card-b">
      <div className="flex wrap"><button className="btn" onClick={exportData}><Ic d={ICONS.download}/> Backup exportieren (JSON)</button>
        {!empty&&<button className="btn" onClick={doSeed} disabled={seeding}><Ic d={ICONS.db}/> {seeding?"Lädt…":"Startdaten (neu) laden"}</button>}</div></div></div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
