<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRS Personalmanagement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --panel:#ffffff; --panel2:#f8fafc;
  --line:#e2e8f0; --line2:#cbd5e1; --text:#0f172a; --muted:#64748b;
  --brand:#2563eb; --brand-d:#1d4ed8; --brand-l:#dbeafe;
  --green:#059669; --green-l:#d1fae5; --amber:#d97706; --amber-l:#fef3c7;
  --red:#dc2626; --red-l:#fee2e2; --violet:#7c3aed; --violet-l:#ede9fe;
  --teal:#0d9488; --teal-l:#ccfbf1;
  --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 10px 40px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--panel2);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--bg);color:#cbd5e1;display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:20}
.sb-brand{padding:20px 18px 16px;border-bottom:1px solid #1e293b}
.sb-brand h1{font-size:16px;margin:0;color:#fff;letter-spacing:.3px}
.sb-brand span{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.sb-nav{flex:1;padding:10px 10px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;cursor:pointer;
  color:#94a3b8;font-weight:500;margin-bottom:2px;transition:all .12s;user-select:none}
.sb-item:hover{background:#1e293b;color:#e2e8f0}
.sb-item.active{background:var(--brand);color:#fff}
.sb-item .ic{width:18px;height:18px;flex-shrink:0}
.sb-foot{padding:12px;border-top:1px solid #1e293b;font-size:11px;color:#475569}
.sb-foot .btn{width:100%;justify-content:center;margin-top:8px;background:#1e293b;border-color:#334155;color:#cbd5e1}
.sb-foot .btn:hover{background:#334155}
.main{flex:1;margin-left:230px;min-width:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{margin:0;font-size:19px;font-weight:600}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.content{padding:24px 28px 60px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .12s;
  font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{filter:brightness(.94)}
.btn.danger{background:var(--panel);border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:27px;font-weight:700;margin-top:6px;line-height:1}
.stat .foot{font-size:12px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 260px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--brand-l);color:var(--brand-d)}.b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)}.b-red{background:var(--red-l);color:var(--red)}
.b-violet{background:var(--violet-l);color:var(--violet)}.b-teal{background:var(--teal-l);color:var(--teal)}
.b-gray{background:#f1f5f9;color:#475569}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;
  font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .16s ease}
.modal.wide{max-width:860px}.modal.xwide{max-width:1050px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{margin:0;font-size:16.5px;font-weight:600}
.modal-b{padding:22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel2);border-radius:0 0 14px 14px}
.x-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;width:auto}
.x-btn:hover{background:var(--panel2);color:var(--text)}
.week-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.week-grid{display:grid;min-width:900px}
.wg-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:78px;position:relative}
.wg-head{background:var(--panel2);font-weight:600;font-size:12.5px;padding:10px 8px;border-right:1px solid var(--line);
  border-bottom:2px solid var(--line2);position:sticky;top:0;z-index:2;text-align:center}
.wg-head.today{background:var(--brand-l);color:var(--brand-d)}
.wg-emp{background:var(--panel2);font-weight:600;font-size:12.5px;padding:10px 12px;border-right:2px solid var(--line2);
  border-bottom:1px solid var(--line);position:sticky;left:0;z-index:1;display:flex;align-items:center;min-width:150px}
.wg-emp.corner{z-index:3;border-bottom:2px solid var(--line2)}
.wg-day{cursor:pointer;transition:background .1s}
.wg-day:hover{background:var(--brand-l)}
.wg-day.weekend{background:#fafbfc}.wg-day.today{background:#eff6ff}
.chip{font-size:11px;padding:4px 7px;border-radius:6px;margin-bottom:4px;cursor:grab;line-height:1.25;
  border-left:3px solid;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative}
.chip:active{cursor:grabbing}
.chip.frei{background:var(--amber-l);border-left-color:var(--amber)}
.chip .cn{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cs{color:var(--muted);font-size:10px}
.chip .ausland{position:absolute;top:3px;right:4px;font-size:9px}
.wg-day.drop-hover{background:var(--green-l);outline:2px dashed var(--green);outline-offset:-2px}
.add-hint{color:var(--line2);font-size:20px;text-align:center;line-height:60px;opacity:0;transition:opacity .1s}
.wg-day:hover .add-hint{opacity:1}
.flex{display:flex;align-items:center;gap:10px}.flex.wrap{flex-wrap:wrap}
.spacer{flex:1}.muted{color:var(--muted)}.mini{font-size:12px}
.pill-tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.pill-tabs button{border:none;background:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);font-family:inherit}
.pill-tabs button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.progress{height:7px;background:var(--line);border-radius:20px;overflow:hidden;min-width:60px}
.progress > div{height:100%;background:var(--brand);border-radius:20px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;font-size:12.5px}
.tag button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;width:auto;font-size:14px;line-height:1}
.tag button:hover{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:15px;font-weight:600;color:#334155;margin-bottom:6px}
.search{max-width:280px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .name{width:150px;font-size:12.5px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--panel2);border-radius:6px;height:24px;position:relative;overflow:hidden;display:flex}
.bar-seg{height:100%;display:flex;align-items:center;padding:0 6px;font-size:11px;color:#fff;font-weight:600;min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.notify-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:var(--shadow-lg);animation:pop .2s}
.rec-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.diffcol{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
/* auth / setup */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(135deg,#0f172a,#1e293b)}
.auth-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;padding:32px}
.auth-card.wide{max-width:720px}
.auth-card h1{font-size:21px;margin:0 0 4px}
.auth-card .lead{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sql-box{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.5;max-height:280px;overflow:auto;white-space:pre;margin:8px 0}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12px;font-weight:700;margin-right:8px;flex-shrink:0}
.err{background:var(--red-l);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.ok{background:var(--green-l);color:var(--green);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
@media(max-width:820px){.sidebar{width:64px}.sb-brand h1,.sb-brand span,.sb-item span,.sb-foot .txt{display:none}
  .main{margin-left:64px}.sb-item{justify-content:center}.row2{grid-template-columns:1fr}}
</style>
</head>

create table if not exists employees (
  id uuid primary key default gen_random_uuid(),
  name text not null, email text default '', phone text default '',
  role text default '', created_at timestamptz default now());

create table if not exists projects (
  nr text primary key, name text default '', typ text default '',
  leiter jsonb default '[]'::jsonb, gesellschaft text default '',
  schadendatum date, startdatum date, enddatum date,
  gesamt int default 0, fiktiv int default 0, zu_reparieren int default 0,
  dol_fertig int default 0, fortschritt numeric default 0,
  umsatz numeric default 0, technikerkosten numeric default 0,
  status text default 'Vorbereitung');

create table if not exists assignments (
  id uuid primary key default gen_random_uuid(),
  employee_id uuid references employees(id) on delete cascade,
  date date not null, type text default 'project', project_nr text,
  einsatz text, title text, ort text default 'inland',
  note text default '', created_at timestamptz default now());

create table if not exists settings (key text primary key, value jsonb);

alter table employees enable row level security;
alter table projects enable row level security;
alter table assignments enable row level security;
alter table settings enable row level security;

create policy "auth all" on employees   for all to authenticated using (true) with check (true);
create policy "auth all" on projects    for all to authenticated using (true) with check (true);
create policy "auth all" on assignments for all to authenticated using (true) with check (true);

function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function isoYear(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);return d.getUTCFullYear();}
function mondayOfWeek(year,week){const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow=simple.getUTCDay();const monday=new Date(simple);
  if(dow<=4)monday.setUTCDate(simple.getUTCDate()-simple.getUTCDay()+1);
  else monday.setUTCDate(simple.getUTCDate()+8-simple.getUTCDay());return monday;}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ============================================================= ROOT */
function Root(){
  const[cfg,setCfg]=useState(getConfig());
  const[sb,setSb]=useState(null);
  const[session,setSession]=useState(null);
  const[booting,setBooting]=useState(true);

  useEffect(()=>{
    if(!cfg.url||!cfg.key){setBooting(false);return;}
    let client;
    try{client=supabase.createClient(cfg.url,cfg.key);}
    catch(e){setBooting(false);return;}
    setSb(client);
    client.auth.getSession().then(({data})=>{setSession(data.session);setBooting(false);});
    const{data:sub}=client.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[cfg]);

  if(booting)return<div className="center-screen"><div className="spin"></div></div>;
  if(!cfg.url||!cfg.key)return<Setup onSaved={()=>setCfg(getConfig())}/>;
  if(!session)return<Login sb={sb} onReset={()=>{localStorage.removeItem("pms_sb_url");localStorage.removeItem("pms_sb_key");setCfg(getConfig());}}/>;
  return<App sb={sb} session={session}/>;
}

function Setup({onSaved}){

function Login({sb,onReset}){
  const[email,setEmail]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[busy,setBusy]=useState(false);

    const{error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    setBusy(false);if(error)setErr(error.message);}
  return(<div className="center-screen"><div className="auth-card">
    <h1>DRS Personalmanagement</h1>
    <p className="lead">Bitte anmelden.</p>
    {err&&<div className="err">{err}</div>}
    <div className="field"><label>E-Mail</label>
      <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
    <div className="field"><label>Passwort</label>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
    <button className="btn primary" style={{width:"100%"}} onClick={submit} disabled={busy}>{busy?"Anmelden…":"Anmelden"}</button>
    <p className="mini muted" style={{marginTop:16,textAlign:"center"}}>
      Benutzer werden im Supabase-Dashboard angelegt (Authentication → Users).<br/>
      <a href="#" onClick={e=>{e.preventDefault();if(confirm("Supabase-Verbindung zurücksetzen?"))onReset();}}>Verbindung ändern</a></p>
  </div></div>);
}

/* ============================================================= APP */
function App({sb,session}){
  const[tab,setTab]=useState("dash");
  const[loading,setLoading]=useState(true);
  const[loadErr,setLoadErr]=useState("");
  const[employees,setEmployees]=useState([]);
  const[projects,setProjects]=useState([]);
  const[assignments,setAssignments]=useState([]);
  const[roles,setRoles]=useState(DEFAULT_ROLES);
  const[einsatz,setEinsatz]=useState(DEFAULT_EINSATZ);
  const[typen,setTypen]=useState(DEFAULT_TYPEN);
  const[toast,showToast]=useToast();

  async function reload(){
    setLoading(true);setLoadErr("");
    try{
      const[e,p,a,s]=await Promise.all([
        sb.from("employees").select("*").order("name"),
        sb.from("projects").select("*").order("nr",{ascending:false}),
        sb.from("assignments").select("*"),
        sb.from("settings").select("*")]);
      if(e.error)throw e.error;if(p.error)throw p.error;if(a.error)throw a.error;if(s.error)throw s.error;
      setEmployees(e.data||[]);
      setProjects((p.data||[]).map(projFromDb));
      setAssignments((a.data||[]).map(asgFromDb));
      const sm={};(s.data||[]).forEach(r=>sm[r.key]=r.value);
      setRoles(sm.roles||DEFAULT_ROLES);setEinsatz(sm.einsatz||DEFAULT_EINSATZ);setTypen(sm.typen||DEFAULT_TYPEN);
    }catch(err){setLoadErr(err.message||"Ladefehler");}
    setLoading(false);
  }
  useEffect(()=>{reload();},[]);

  /* ---- data API ---- */
  const api={
    async saveEmployee(rec,isNew){
      if(isNew){const{data,error}=await sb.from("employees").insert({name:rec.name,email:rec.email,phone:rec.phone,role:rec.role}).select().single();
        if(error)return showToast("Fehler: "+error.message);setEmployees(es=>[...es,data].sort((a,b)=>a.name.localeCompare(b.name)));showToast("Mitarbeiter angelegt");}
      else{const{error}=await sb.from("employees").update({name:rec.name,email:rec.email,phone:rec.phone,role:rec.role}).eq("id",rec.id);
        if(error)return showToast("Fehler: "+error.message);setEmployees(es=>es.map(e=>e.id===rec.id?{...e,...rec}:e));showToast("Gespeichert");}},
    async deleteEmployee(id){const{error}=await sb.from("employees").delete().eq("id",id);
      if(error)return showToast("Fehler: "+error.message);
      setEmployees(es=>es.filter(e=>e.id!==id));setAssignments(as=>as.filter(a=>a.employeeId!==id));showToast("Mitarbeiter gelöscht");},
    async saveProject(rec,isNew){
      if(isNew){const{error}=await sb.from("projects").insert(projToDb(rec));
        if(error)return showToast("Fehler: "+error.message);setProjects(ps=>[rec,...ps]);showToast("Projekt angelegt");}
      else{const{error}=await sb.from("projects").update(projToDb(rec)).eq("nr",rec.nr);
        if(error)return showToast("Fehler: "+error.message);setProjects(ps=>ps.map(p=>p.nr===rec.nr?rec:p));showToast("Projekt gespeichert");}},
    async deleteProject(nr){const{error}=await sb.from("projects").delete().eq("nr",nr);
      if(error)return showToast("Fehler: "+error.message);setProjects(ps=>ps.filter(p=>p.nr!==nr));showToast("Projekt gelöscht");},
    async upsertProjects(newList,updateList){
      const all=[...newList,...updateList];if(!all.length)return{add:0,upd:0};
      const{error}=await sb.from("projects").upsert(all.map(projToDb),{onConflict:"nr"});
      if(error){showToast("Fehler: "+error.message);return null;}
      setProjects(ps=>{let out=[...ps];
        newList.forEach(it=>out.unshift(it));
        updateList.forEach(it=>{out=out.map(p=>p.nr===it.nr?{...p,...it}:p);});
        return out;});
      return{add:newList.length,upd:updateList.length};},
    async saveAssignment(rec,isNew){
      if(isNew){const{data,error}=await sb.from("assignments").insert(asgToDb(rec)).select().single();
        if(error)return showToast("Fehler: "+error.message);setAssignments(as=>[...as,asgFromDb(data)]);showToast("Einsatz angelegt");}
      else{const{error}=await sb.from("assignments").update(asgToDb(rec)).eq("id",rec.id);
        if(error)return showToast("Fehler: "+error.message);setAssignments(as=>as.map(a=>a.id===rec.id?rec:a));showToast("Einsatz aktualisiert");}},
    async deleteAssignment(id){const{error}=await sb.from("assignments").delete().eq("id",id);
      if(error)return showToast("Fehler: "+error.message);setAssignments(as=>as.filter(a=>a.id!==id));showToast("Einsatz gelöscht");},
    async moveAssignment(id,employeeId,date){
      const{error}=await sb.from("assignments").update({employee_id:employeeId,date}).eq("id",id);
      if(error)return showToast("Fehler: "+error.message);
      setAssignments(as=>as.map(a=>a.id===id?{...a,employeeId,date}:a));},
    async setSetting(key,value,label){
      const setter={roles:setRoles,einsatz:setEinsatz,typen:setTypen}[key];setter(value);
      const{error}=await sb.from("settings").upsert({key,value},{onConflict:"key"});
      if(error)showToast("Fehler: "+error.message);},
    async seed(){
      const existing=new Set(employees.map(e=>e.name));
      const toAdd=SEED.employees.filter(n=>!existing.has(n)).map((n,i)=>({name:n,email:"",phone:"",
        role:n.includes("SPM")?"Projektleiter":(i%4===0?"Projektleiter":"Techniker")}));
      if(toAdd.length){const{error}=await sb.from("employees").insert(toAdd);if(error)return showToast("Fehler: "+error.message);}
      const{error:pe}=await sb.from("projects").upsert(SEED.projects.map(projToDb),{onConflict:"nr"});
      if(pe)return showToast("Fehler: "+pe.message);
      await sb.from("settings").upsert([{key:"roles",value:DEFAULT_ROLES},{key:"einsatz",value:DEFAULT_EINSATZ},
        {key:"typen",value:DEFAULT_TYPEN}],{onConflict:"key"});
      showToast("Startdaten geladen");reload();},
  };

  const store={employees,projects,assignments,roles,einsatz,typen,api,showToast,session,reload};

  const NAV=[["dash","Dashboard",ICONS.dash],["week","Wochenplanung",ICONS.week],
    ["proj","Projekte",ICONS.proj],["emp","Mitarbeiter",ICONS.emp],
    ["stat","Statistik",ICONS.stat],["set","Einstellungen",ICONS.set]];
  const titles={dash:["Dashboard","Was diese Woche ansteht"],week:["Wochenplanung","Einsätze planen & per Drag&Drop verschieben"],
    proj:["Projekte","Projekte erfassen und aus Excel importieren"],emp:["Mitarbeiter","Mitarbeiterdatenbank verwalten"],
    stat:["Statistik","Einsätze der Mitarbeiter – In- & Ausland"],set:["Einstellungen","Rollen, Status, Projekttypen & Daten"]};

  return(<div className="app">
    <div className="sidebar">
      <div className="sb-brand"><h1>DRS Personal</h1><span>Management</span></div>
      <div className="sb-nav">
        {NAV.map(([k,l,ic])=>(<div key={k} className={"sb-item"+(tab===k?" active":"")} onClick={()=>setTab(k)}>
          <Ic d={ic}/><span>{l}</span></div>))}
      </div>
      <div className="sb-foot">
        <div className="txt">{employees.length} Mitarbeiter · {projects.length} Projekte</div>
        <div className="txt" style={{marginTop:4,opacity:.7,overflow:"hidden",textOverflow:"ellipsis"}}>{session.user.email}</div>
        <button className="btn sm" onClick={()=>sb.auth.signOut()}><Ic d={ICONS.logout}/> <span className="txt">Abmelden</span></button>
      </div>
    </div>
    <div className="main">
      <div className="topbar"><div><h2>{titles[tab][0]}</h2><div className="sub">{titles[tab][1]}</div></div></div>
      <div className="content">
        {loading?<div className="spin"></div>:
         loadErr?<div className="card"><div className="card-b"><div className="err">Fehler beim Laden: {loadErr}</div>
            <button className="btn" onClick={reload}>Erneut versuchen</button></div></div>:<>
          {tab==="dash"&&<Dashboard store={store} go={setTab}/>}
          {tab==="week"&&<Wochenplanung store={store}/>}
          {tab==="proj"&&<Projekte store={store}/>}
          {tab==="emp"&&<Mitarbeiter store={store}/>}
          {tab==="stat"&&<Statistik store={store}/>}
          {tab==="set"&&<Einstellungen store={store}/>}
        </>}
      </div>
    </div>
    {toast}
  </div>);
}

/* ============================================================= DASHBOARD */

/* ============================================================= WOCHENPLANUNG */
function Wochenplanung({store}){
  const{employees,projects,assignments,api}=store;
  const now=new Date();
  const[wk,setWk]=useState(isoWeek(now));const[yr,setYr]=useState(isoYear(now));
  const[modal,setModal]=useState(null);const[dragId,setDragId]=useState(null);const[dropCell,setDropCell]=useState(null);
  const monday=mondayOfWeek(yr,wk);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const empById=id=>employees.find(e=>e.id===id);const projByNr=nr=>projects.find(p=>p.nr===nr);
  function nav(delta){let w=wk+delta,y=yr;
    if(w<1){y--;w=isoWeek(new Date(y,11,28));}else if(w>isoWeek(new Date(y,11,28))){y++;w=1;}setWk(w);setYr(y);}
  const cellItems=(empId,date)=>assignments.filter(a=>a.employeeId===empId&&a.date===date);
  function onDrop(empId,date){if(!dragId)return;api.moveAssignment(dragId,empId,date);setDragId(null);setDropCell(null);}

  return(<div>
    <div className="flex" style={{marginBottom:16}}>
      <button className="btn sm" onClick={()=>nav(-1)}><Ic d={ICONS.chev} style={{transform:"rotate(180deg)"}}/></button>
      <div style={{fontWeight:700,fontSize:16,minWidth:200,textAlign:"center"}}>KW {wk} · {yr}
        <div className="mini muted" style={{fontWeight:400}}>{fmtDEShort(days[0])} – {fmtDEShort(days[6])}</div></div>
      <button className="btn sm" onClick={()=>nav(1)}><Ic d={ICONS.chev}/></button>
      <button className="btn sm" onClick={()=>{setWk(isoWeek(now));setYr(isoYear(now));}}>Heute</button>
      <span className="spacer"></span>
      <span className="mini muted">Tag anklicken für neuen Einsatz · Chips per Drag &amp; Drop verschieben</span>
    </div>
    <div className="week-wrap"><div className="week-grid" style={{gridTemplateColumns:"150px repeat(7,1fr)"}}>
      <div className="wg-emp corner">Mitarbeiter</div>
      {days.map((d,i)=>(<div key={i} className={"wg-head"+(ymd(d)===todayYMD?" today":"")}>{DAYNAMES[i]} {fmtDEShort(d)}</div>))}
      {employees.map(emp=>(<React.Fragment key={emp.id}>
        <div className="wg-emp">{emp.name}</div>
        {days.map((d,i)=>{const date=ymd(d);const items=cellItems(emp.id,date);
          const isWknd=i>=5;const isToday=date===todayYMD;const cellKey=emp.id+date;
          return(<div key={i}
            className={"wg-cell wg-day"+(isWknd?" weekend":"")+(isToday?" today":"")+(dropCell===cellKey?" drop-hover":"")}
            onClick={e=>{if(e.target.closest(".chip"))return;setModal({employeeId:emp.id,date});}}
            onDragOver={e=>{e.preventDefault();setDropCell(cellKey);}}
            onDragLeave={()=>setDropCell(c=>c===cellKey?null:c)}
            onDrop={e=>{e.preventDefault();onDrop(emp.id,date);}}>
            {items.map(a=>{const p=projByNr(a.projectNr);
              const col=a.type==="frei"?"var(--amber)":(EINSATZ_COLORS[a.einsatz]||"var(--brand)");
              return(<div key={a.id} className={"chip"+(a.type==="frei"?" frei":"")}
                draggable onDragStart={()=>setDragId(a.id)} onDragEnd={()=>{setDragId(null);setDropCell(null);}}
                style={{borderLeftColor:col}}
                onClick={e=>{e.stopPropagation();setModal({employeeId:emp.id,date,editing:a});}}>
                {a.ort==="ausland"&&<span className="ausland" title="Ausland">✈</span>}
                <span className="cn">{a.type==="frei"?(a.title||"Freier Termin"):(p?p.name:a.projectNr)}</span>
                <span className="cs">{a.type==="frei"?"Freier Termin":(a.einsatz||"")}</span></div>);})}
            {items.length===0&&<div className="add-hint">+</div>}
          </div>);})}
      </React.Fragment>))}
    </div></div>
    {modal&&<AssignModal store={store} ctx={modal} onClose={()=>setModal(null)}/>}
  </div>);
}

function AssignModal({store,ctx,onClose}){
  const{projects,employees,einsatz,api}=store;
  const ed=ctx.editing;const emp=employees.find(e=>e.id===ctx.employeeId);
  const[mode,setMode]=useState(ed?ed.type:"project");
  const[projectNr,setProjectNr]=useState(ed?.projectNr||"");
  const[eins,setEins]=useState(ed?.einsatz||einsatz[0]||"");
  const[title,setTitle]=useState(ed?.title||"");const[ort,setOrt]=useState(ed?.ort||"inland");
  const[note,setNote]=useState(ed?.note||"");const[q,setQ]=useState("");
  const activeProjects=projects.filter(p=>p.status!=="Beendet");
  const filtered=activeProjects.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase())||p.nr.includes(q));
  const proj=projects.find(p=>p.nr===projectNr);
  function submit(){
    if(mode==="project"&&!projectNr){store.showToast("Bitte Projekt wählen");return;}
    if(mode==="frei"&&!title.trim()){store.showToast("Bitte Titel eingeben");return;}
    const rec={id:ed?ed.id:undefined,employeeId:ctx.employeeId,date:ctx.date,type:mode,
      projectNr:mode==="project"?projectNr:null,einsatz:mode==="project"?eins:null,
      title:mode==="frei"?title.trim():null,ort,note};
    api.saveAssignment(rec,!ed);onClose();}
  function del(){api.deleteAssignment(ed.id);onClose();}
  const vn=emp?.name?.split(",")[1]?.trim()||emp?.name||"";
  const dateDE=fmtDE(ctx.date);
  const msg=mode==="project"
    ?`Hallo ${vn}, du bist am ${dateDE} für das Projekt "${proj?.name||""}" (${eins}${ort==="ausland"?", Ausland":""}) eingeplant.${note?" Hinweis: "+note:""}`
    :`Hallo ${vn}, Termin am ${dateDE}: ${title}${ort==="ausland"?" (Ausland)":""}.${note?" Hinweis: "+note:""}`;
  const subj=mode==="project"?`Einsatzplanung ${dateDE}`:`Termin ${dateDE}`;
  return(<Modal title={(ed?"Einsatz bearbeiten":"Einsatz hinzufügen")+" · "+dateDE} onClose={onClose} wide
    footer={<>{ed&&<button className="btn danger" onClick={del}><Ic d={ICONS.trash}/> Löschen</button>}
      <span className="spacer"></span><button className="btn" onClick={onClose}>Abbrechen</button>
      <button className="btn primary" onClick={submit}>{ed?"Speichern":"Anlegen"}</button></>}>
    <div className="field"><label>Mitarbeiter</label><div style={{fontWeight:600,padding:"6px 0"}}>{emp?.name}</div></div>
    <div className="pill-tabs" style={{marginBottom:16}}>
      <button className={mode==="project"?"active":""} onClick={()=>setMode("project")}>Projekteinsatz</button>
      <button className={mode==="frei"?"active":""} onClick={()=>setMode("frei")}>Freier Termin</button></div>
    {mode==="project"?<>
      <div className="field"><label>Projekt suchen</label>
        <input placeholder="Projektname oder Nr…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="field"><label>Aktives Projekt wählen</label>
        <div className="diffcol">{filtered.slice(0,80).map(p=>(
          <label key={p.nr} className="rec-row" style={{cursor:"pointer",
            borderColor:projectNr===p.nr?"var(--brand)":"var(--line)",background:projectNr===p.nr?"var(--brand-l)":"#fff"}}>
            <input type="radio" style={{width:"auto"}} checked={projectNr===p.nr} onChange={()=>setProjectNr(p.nr)}/>
            <span style={{fontWeight:600}}>{p.name}</span><span className="muted mini">Nr. {p.nr}</span>
            <span className="spacer"></span><span className={"badge "+(STATUS_COLORS[p.status]||"b-gray")}>{p.status}</span></label>))}
          {filtered.length===0&&<div className="muted mini" style={{padding:8}}>Keine Projekte gefunden.</div>}</div></div>
      <div className="row2">
        <div className="field"><label>Einsatzstatus / Tätigkeit</label>
          <select value={eins} onChange={e=>setEins(e.target.value)}>{einsatz.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="field"><label>Ort</label><select value={ort} onChange={e=>setOrt(e.target.value)}>
          <option value="inland">Inland</option><option value="ausland">Ausland</option></select></div></div>
    </>:<>
      <div className="field"><label>Titel des Termins</label>
        <input placeholder="z. B. Urlaub, Schulung, Sondereinsatz…" value={title} onChange={e=>setTitle(e.target.value)}/></div>
      <div className="field"><label>Ort</label><select value={ort} onChange={e=>setOrt(e.target.value)}>
        <option value="inland">Inland</option><option value="ausland">Ausland</option></select></div></>}
    <div className="field"><label>Hinweis (optional)</label>
      <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Zusätzliche Info für den Mitarbeiter…"/></div>
    <NotifyPanel emp={emp} message={msg} subject={subj}/>
  </Modal>);
}

/* ============================================================= PROJEKTE */
function Projekte({store}){
  const{projects,typen,api}=store;
  const[q,setQ]=useState("");const[fStatus,setFStatus]=useState("");const[fTyp,setFTyp]=useState("");
  const[edit,setEdit]=useState(null);const[importOpen,setImportOpen]=useState(false);

        <td><div className="flex"><div className="progress"><div style={{width:Math.round((p.fortschritt||0)*100)+"%"}}></div></div>
          <span className="mini">{Math.round((p.fortschritt||0)*100)}%</span></div></td>

        <td><div className="flex"><button className="btn ghost sm" onClick={()=>setEdit(p)}><Ic d={ICONS.edit}/></button>

function ProjectEdit({store,proj,onClose}){
  const{projects,typen,api}=store;const isNew=!proj.nr;
  const[f,setF]=useState({nr:proj.nr||"",name:proj.name||"",typ:proj.typ||typen[0]||"",
    leiter:(proj.leiter||[]).join("\n"),startdatum:proj.startdatum||"",enddatum:proj.enddatum||"",
    fortschritt:proj.fortschritt!=null?Math.round(proj.fortschritt*100):0,status:proj.status||"Vorbereitung",
    gesellschaft:proj.gesellschaft||"DRS Hagelschaden",umsatz:proj.umsatz||0,technikerkosten:proj.technikerkosten||0});
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  const allStatus=["Vorbereitung","Begutachtung","Reparatur","Finance","Beendet","fiktiv"];
  function submit(){
    if(!f.nr.trim()){store.showToast("Projekt-Nr erforderlich");return;}
    if(isNew&&projects.some(p=>p.nr===f.nr.trim())){store.showToast("Nr existiert bereits");return;}
    const rec={...proj,nr:f.nr.trim(),name:f.name.trim(),typ:f.typ,
      leiter:f.leiter.split("\n").map(x=>x.trim()).filter(Boolean),
      startdatum:f.startdatum||null,enddatum:f.enddatum||null,
      fortschritt:(parseFloat(f.fortschritt)||0)/100,status:f.status,gesellschaft:f.gesellschaft,
      umsatz:parseFloat(f.umsatz)||0,technikerkosten:parseFloat(f.technikerkosten)||0};
    api.saveProject(rec,isNew);onClose();}
  return(<Modal title={isNew?"Neues Projekt":"Projekt bearbeiten"} onClose={onClose} wide
    footer={<><button className="btn" onClick={onClose}>Abbrechen</button>
      <button className="btn primary" onClick={submit}>{isNew?"Anlegen":"Speichern"}</button></>}>
    <div className="row2">
      <div className="field"><label>Projekt-Nr</label><input value={f.nr} onChange={e=>set("nr",e.target.value)} disabled={!isNew}/></div>
      <div className="field"><label>Gesellschaft</label><input value={f.gesellschaft} onChange={e=>set("gesellschaft",e.target.value)}/></div></div>
    <div className="field"><label>Projektname</label><input value={f.name} onChange={e=>set("name",e.target.value)}/></div>
    <div className="row2">
      <div className="field"><label>Projekttyp</label><select value={f.typ} onChange={e=>set("typ",e.target.value)}>{typen.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="field"><label>Projektstatus</label><select value={f.status} onChange={e=>set("status",e.target.value)}>{allStatus.map(s=><option key={s}>{s}</option>)}</select></div></div>
    <div className="row2">
      <div className="field"><label>Startdatum</label><input type="date" value={f.startdatum||""} onChange={e=>set("startdatum",e.target.value)}/></div>
      <div className="field"><label>Enddatum</label><input type="date" value={f.enddatum||""} onChange={e=>set("enddatum",e.target.value)}/></div></div>
    <div className="field"><label>Fortschritt: {f.fortschritt}%</label>
      <input type="range" min="0" max="100" value={f.fortschritt} onChange={e=>set("fortschritt",e.target.value)}/></div>
    <div className="field"><label>Projektleiter (eine Person pro Zeile)</label>
      <textarea value={f.leiter} onChange={e=>set("leiter",e.target.value)} placeholder="Nachname, Vorname"/></div>
  </Modal>);
}

function ImportModal({store,onClose}){
  const{projects,api}=store;const[step,setStep]=useState(1);const[parsed,setParsed]=useState(null);
  const[sel,setSel]=useState({});const fileRef=useRef();const[busy,setBusy]=useState(false);
  function excelDate(v){if(v==null||v==="")return null;
    if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400000));return ymd(d);}
    const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
    m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(m)return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");return null;}
  function num(v){if(v==null||v==="")return 0;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
  function handleFile(e){const file=e.target.files[0];if(!file)return;const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let hi=-1;for(let i=0;i<Math.min(rows.length,12);i++){const r=rows[i].map(x=>String(x).toLowerCase());
        if(r.some(c=>c.includes("projektname"))||(r.includes("nr")&&r.some(c=>c.includes("typ")))){hi=i;break;}}
      if(hi<0)hi=0;const hdr=rows[hi].map(x=>String(x).trim().toLowerCase());
      const col=names=>{for(const n of names){const idx=hdr.findIndex(h=>h===n||h.includes(n));if(idx>=0)return idx;}return -1;};
      const c={nr:col(["nr"]),name:col(["projektname","name"]),typ:col(["projekttyp","typ"]),
        leiter:col(["projektleiter","leiter"]),start:col(["startdatum","start"]),end:col(["enddatum","ende"]),
        fort:col(["fortschritt"]),status:col(["projektstatus","status"]),ges:col(["gesellschaft"]),
        umsatz:col(["umsatz"]),tk:col(["technikerkosten"]),gesamt:col(["gesamt"])};
      const items=[];
      for(let i=hi+1;i<rows.length;i++){const r=rows[i];const nr=c.nr>=0?String(r[c.nr]).trim():"";
        if(!nr||nr==="undefined")continue;const nrClean=nr.replace(/\.0$/,"");
        let fort=c.fort>=0?num(r[c.fort]):0;if(fort>1)fort=fort/100;
        items.push({nr:nrClean,name:c.name>=0?String(r[c.name]).trim():"",typ:c.typ>=0?String(r[c.typ]).trim():"",
          leiter:c.leiter>=0?String(r[c.leiter]).split("\n").map(x=>x.trim()).filter(Boolean):[],
          startdatum:c.start>=0?excelDate(r[c.start]):null,enddatum:c.end>=0?excelDate(r[c.end]):null,
          fortschritt:fort,status:c.status>=0?String(r[c.status]).trim():"Vorbereitung",
          gesellschaft:c.ges>=0?String(r[c.ges]).trim():"",umsatz:c.umsatz>=0?num(r[c.umsatz]):0,
          technikerkosten:c.tk>=0?num(r[c.tk]):0,gesamt:c.gesamt>=0?num(r[c.gesamt]):0});}
      const existNrs=new Set(projects.map(p=>p.nr));const neu=items.filter(it=>!existNrs.has(it.nr));
      const update=items.filter(it=>{const cur=projects.find(p=>p.nr===it.nr);
        return cur&&(cur.status!==it.status||Math.abs((cur.fortschritt||0)-it.fortschritt)>0.001||cur.enddatum!==it.enddatum);});
      const unchanged=items.length-neu.length-update.length;
      const s={};neu.forEach(it=>s["n"+it.nr]=true);update.forEach(it=>s["u"+it.nr]=true);
      setSel(s);setParsed({items,neu,update,unchanged,fileName:file.name});setStep(2);
    }catch(err){store.showToast("Fehler beim Lesen: "+err.message);}};
    rd.readAsArrayBuffer(file);}
  async function apply(){setBusy(true);
    const newList=parsed.neu.filter(it=>sel["n"+it.nr]);const updList=parsed.update.filter(it=>sel["u"+it.nr]);
    const res=await api.upsertProjects(newList,updList);setBusy(false);
    if(res){store.showToast(res.add+" neu · "+res.upd+" aktualisiert");onClose();}}
  return(<Modal title="Excel-Import · Projektabgleich" onClose={onClose} xwide
    footer={step===2?<><button className="btn" onClick={()=>setStep(1)}>Zurück</button><span className="spacer"></span>
      <button className="btn primary" onClick={apply} disabled={busy}>{busy?"Speichern…":"Auswahl übernehmen"}</button></>:
      <button className="btn" onClick={onClose}>Schließen</button>}>
    {step===1&&<div>
      <p className="muted">Lade deine Projektliste (.xlsx) hoch. Die Spalten <b>Nr, Projektname, Typ, Leiter,
        Start-/Enddatum, Fortschritt, Status</b> werden automatisch erkannt – auch wenn die Kopfzeile nicht in Zeile 1 steht.</p>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{display:"none"}}/>
      <div onClick={()=>fileRef.current.click()} style={{border:"2px dashed var(--line2)",borderRadius:12,
        padding:"46px 20px",textAlign:"center",cursor:"pointer",background:"var(--panel2)"}}>
        <Ic d={ICONS.imp} style={{width:34,height:34,color:"var(--brand)",margin:"0 auto 10px"}}/>
        <div style={{fontWeight:600,fontSize:15}}>Excel-Datei auswählen</div>
        <div className="muted mini" style={{marginTop:4}}>Klicken zum Durchsuchen (.xlsx)</div></div></div>}
    {step===2&&parsed&&<div>
      <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)",marginBottom:16}}>
        <div className="stat"><div className="lbl">Neu</div><div className="val" style={{color:"var(--green)"}}>{parsed.neu.length}</div><div className="foot">werden angelegt</div></div>
        <div className="stat"><div className="lbl">Geändert</div><div className="val" style={{color:"var(--amber)"}}>{parsed.update.length}</div><div className="foot">Status/Fortschritt/Ende</div></div>
        <div className="stat"><div className="lbl">Unverändert</div><div className="val muted">{parsed.unchanged}</div><div className="foot">übersprungen</div></div></div>
      <div className="grid" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div><div className="flex" style={{marginBottom:8}}><b>Neue Projekte</b><span className="spacer"></span>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.neu.forEach(it=>s["n"+it.nr]=true);setSel(s);}}>Alle</button>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.neu.forEach(it=>s["n"+it.nr]=false);setSel(s);}}>Keine</button></div>
          <div className="diffcol">{parsed.neu.length===0&&<div className="muted mini" style={{padding:8}}>Keine neuen Projekte.</div>}
            {parsed.neu.map(it=>(<label key={it.nr} className="rec-row" style={{cursor:"pointer"}}>
              <input type="checkbox" style={{width:"auto"}} checked={!!sel["n"+it.nr]} onChange={e=>setSel(s=>({...s,["n"+it.nr]:e.target.checked}))}/>
              <span style={{fontWeight:600}}>{it.nr}</span>
              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{it.name}</span>
              <span className={"badge "+(STATUS_COLORS[it.status]||"b-gray")}>{it.status}</span></label>))}</div></div>
        <div><div className="flex" style={{marginBottom:8}}><b>Geänderte Projekte</b><span className="spacer"></span>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.update.forEach(it=>s["u"+it.nr]=true);setSel(s);}}>Alle</button>
          <button className="btn ghost sm" onClick={()=>{const s={...sel};parsed.update.forEach(it=>s["u"+it.nr]=false);setSel(s);}}>Keine</button></div>
          <div className="diffcol">{parsed.update.length===0&&<div className="muted mini" style={{padding:8}}>Keine Änderungen.</div>}
            {parsed.update.map(it=>{const cur=projects.find(p=>p.nr===it.nr);
              return(<label key={it.nr} className="rec-row" style={{cursor:"pointer"}}>
                <input type="checkbox" style={{width:"auto"}} checked={!!sel["u"+it.nr]} onChange={e=>setSel(s=>({...s,["u"+it.nr]:e.target.checked}))}/>
                <span style={{fontWeight:600}}>{it.nr}</span>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{it.name}</span>
                <span className="mini muted">{cur.status}→</span>
                <span className={"badge "+(STATUS_COLORS[it.status]||"b-gray")}>{it.status}</span></label>);})}</div></div>
      </div></div>}
  </Modal>);
}

/* ============================================================= STATISTIK */
function Statistik({store}){
  const{employees,assignments}=store;
  const rows=employees.map(e=>{const mine=assignments.filter(a=>a.employeeId===e.id);
    return{e,total:mine.length,inland:mine.filter(a=>a.ort!=="ausland").length,ausland:mine.filter(a=>a.ort==="ausland").length};})
    .filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  const maxT=Math.max(1,...rows.map(r=>r.total));
  const totalEins=assignments.length;const totalAusland=assignments.filter(a=>a.ort==="ausland").length;
  const totalFrei=assignments.filter(a=>a.type==="frei").length;
  const byStatus={};assignments.filter(a=>a.type==="project"&&a.einsatz).forEach(a=>byStatus[a.einsatz]=(byStatus[a.einsatz]||0)+1);
  const statusRows=Object.entries(byStatus).sort((a,b)=>b[1]-a[1]);const maxS=Math.max(1,...statusRows.map(r=>r[1]));
  return(<div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",marginBottom:20}}>
      <div className="stat"><div className="lbl">Einsätze gesamt</div><div className="val">{totalEins}</div></div>
      <div className="stat"><div className="lbl">Inland</div><div className="val" style={{color:"var(--brand)"}}>{totalEins-totalAusland}</div></div>
      <div className="stat"><div className="lbl">Ausland</div><div className="val" style={{color:"var(--teal)"}}>{totalAusland}</div><div className="foot">✈ Auslandseinsätze</div></div>
      <div className="stat"><div className="lbl">Freie Termine</div><div className="val" style={{color:"var(--amber)"}}>{totalFrei}</div></div></div>
    {rows.length===0?<div className="card"><div className="empty"><div className="big">Noch keine Einsätze erfasst</div>
      <div>Sobald du in der Wochenplanung Einsätze anlegst, erscheint hier die Auswertung nach Mitarbeiter sowie In-/Ausland.</div></div></div>:<>
    <div className="card" style={{marginBottom:18}}>
      <div className="card-h"><h3>Einsätze pro Mitarbeiter · In- &amp; Ausland</h3></div>
      <div className="card-b">
        <div className="legend"><span><span className="dot" style={{background:"var(--brand)"}}></span> Inland</span>
          <span><span className="dot" style={{background:"var(--teal)"}}></span> Ausland</span></div>
        {rows.map(r=>(<div key={r.e.id} className="bar-row"><div className="name">{r.e.name}</div>
          <div className="bar-track">
            {r.inland>0&&<div className="bar-seg" style={{background:"var(--brand)",width:(r.inland/maxT*100)+"%"}}>{r.inland}</div>}
            {r.ausland>0&&<div className="bar-seg" style={{background:"var(--teal)",width:(r.ausland/maxT*100)+"%"}}>{r.ausland}</div>}</div>
          <div style={{width:36,fontWeight:600,fontSize:12.5}}>{r.total}</div></div>))}</div></div>
    <div className="card"><div className="card-h"><h3>Einsätze nach Tätigkeit</h3></div><div className="card-b">
      {statusRows.length===0?<div className="muted mini">Keine Projekteinsätze erfasst.</div>:
      statusRows.map(([k,v])=>(<div key={k} className="bar-row"><div className="name">{k}</div>
        <div className="bar-track"><div className="bar-seg" style={{background:EINSATZ_COLORS[k]||"var(--violet)",width:(v/maxS*100)+"%"}}>{v}</div></div>
        <div style={{width:36,fontWeight:600,fontSize:12.5}}>{v}</div></div>))}</div></div></>}
  </div>);
}

/* ============================================================= EINSTELLUNGEN */
function ListEditor({title,desc,skey,items,api,showToast}){
  const[val,setVal]=useState("");
  function add(){const v=val.trim();if(!v)return;if(items.includes(v)){showToast("Existiert bereits");return;}
    api.setSetting(skey,[...items,v]);setVal("");}
  function rm(it){api.setSetting(skey,items.filter(x=>x!==it));}
  return(<div className="card" style={{marginBottom:18}}>
    <div className="card-h"><h3>{title}</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>{desc}</p>
      <div className="tag-list" style={{marginBottom:14}}>
        {items.map(it=>(<span key={it} className="tag">{it}<button onClick={()=>rm(it)} title="Entfernen">×</button></span>))}
        {items.length===0&&<span className="muted mini">Noch nichts angelegt.</span>}</div>
      <div className="flex"><input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")add();}}
        placeholder="Neuen Eintrag hinzufügen…" style={{maxWidth:320}}/>
        <button className="btn primary sm" onClick={add}><Ic d={ICONS.plus}/> Hinzufügen</button></div></div></div>);
}

function Einstellungen({store}){
  const{roles,einsatz,typen,api,showToast,employees,projects,assignments}=store;
  const[seeding,setSeeding]=useState(false);
  function exportData(){
    const data={employees,projects,assignments,roles,einsatz,typen,exported:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="drs-personal-backup-"+todayYMD+".json";a.click();showToast("Backup heruntergeladen");}
  async function doSeed(){if(!confirm("Startdaten (163 Projekte, 34 Mitarbeiter) in die Datenbank laden? Vorhandene Projekte mit gleicher Nr werden überschrieben."))return;
    setSeeding(true);await api.seed();setSeeding(false);}
  const empty=projects.length===0&&employees.length===0;
  return(<div>
    {empty&&<div className="card" style={{marginBottom:18,borderColor:"var(--brand)"}}>
      <div className="card-b"><div className="flex" style={{alignItems:"flex-start"}}>
        <Ic d={ICONS.db} style={{width:26,height:26,color:"var(--brand)",flexShrink:0}}/>
        <div><div style={{fontWeight:600,marginBottom:4}}>Datenbank ist leer</div>
          <p className="muted mini" style={{margin:"0 0 12px"}}>Lade die mitgelieferten Startdaten (163 Projekte + 34 Mitarbeiter aus deiner Excel) in Supabase.</p>
          <button className="btn primary" onClick={doSeed} disabled={seeding}>{seeding?"Lädt…":"Startdaten laden"}</button></div>
      </div></div></div>}
    <ListEditor title="Rollen" desc="Rollen für Mitarbeiter – frei definierbar (z. B. Projektleiter, Projektassistenz)."
      skey="roles" items={roles} api={api} showToast={showToast}/>
    <ListEditor title="Einsatzstatus / Tätigkeiten" desc="Was ein Mitarbeiter im Projekt macht (z. B. Begutachtung, Projektleitung). Erscheint bei der Einsatzplanung."
      skey="einsatz" items={einsatz} api={api} showToast={showToast}/>
    <ListEditor title="Projekttypen" desc="Kategorien für Projekte (z. B. Versicherungen, Hagelcover)."
      skey="typen" items={typen} api={api} showToast={showToast}/>
    <div className="card"><div className="card-h"><h3>Daten &amp; Backup</h3></div><div className="card-b">
      <p className="muted mini" style={{marginTop:0}}>Alle Daten liegen zentral in Supabase. Ein zusätzliches lokales Backup als JSON schadet nicht.</p>
      <div className="flex wrap">
        <button className="btn" onClick={exportData}><Ic d={ICONS.download}/> Backup exportieren (JSON)</button>
        {!empty&&<button className="btn" onClick={doSeed} disabled={seeding}><Ic d={ICONS.db}/> {seeding?"Lädt…":"Startdaten (neu) laden"}</button>}
      </div></div></div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
