<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>DRS Personalmanagement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f172a;--bg2:#1e293b;--panel:#ffffff;--panel2:#f8fafc;
  --line:#e2e8f0;--line2:#cbd5e1;--text:#0f172a;--muted:#64748b;
  --brand:#2563eb;--brand-d:#1d4ed8;--brand-l:#dbeafe;
  --green:#059669;--green-l:#d1fae5;--amber:#d97706;--amber-l:#fef3c7;
  --red:#dc2626;--red-l:#fee2e2;--violet:#7c3aed;--violet-l:#ede9fe;
  --teal:#0d9488;--teal-l:#ccfbf1;
  --radius:10px;--shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 10px 40px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--panel2);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#root{min-height:100vh}
/* top nav */
.topnav{position:sticky;top:0;z-index:40;background:var(--bg);color:#fff;display:flex;align-items:center;
  gap:6px;padding:0 18px;height:56px;box-shadow:0 1px 0 #1e293b}
.topnav .brand{font-weight:700;font-size:15px;margin-right:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.topnav .brand small{color:#64748b;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.tnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tnav::-webkit-scrollbar{display:none;height:0;width:0}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;cursor:pointer;color:#94a3b8;
  font-weight:500;white-space:nowrap;user-select:none;font-size:13.5px;border:none;background:none;font-family:inherit}
.tab:hover{background:#1e293b;color:#e2e8f0}
.tab.active{background:var(--brand);color:#fff}
.tab .ic{width:17px;height:17px}
.tnav-user{display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:12px;white-space:nowrap}
.tnav-user .btn{background:#1e293b;border-color:#334155;color:#cbd5e1;padding:6px 11px}
.tnav-user .btn:hover{background:#334155}
.page{padding:20px 24px 60px}
.page.wide{padding:16px 18px 40px}
h2.ttl{margin:0 0 2px;font-size:19px}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.green:hover{filter:brightness(.94)}
.btn.danger{background:var(--panel);border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--red-l)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--panel2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:27px;font-weight:700;margin-top:6px;line-height:1}
.stat .foot{font-size:12px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.4px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--panel2)}
tr.clickrow{cursor:pointer}
.hscroll{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.hscroll::-webkit-scrollbar{display:none;height:0;width:0}
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 220px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-blue{background:var(--brand-l);color:var(--brand-d)}.b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)}.b-red{background:var(--red-l);color:var(--red)}
.b-violet{background:var(--violet-l);color:var(--violet)}.b-teal{background:var(--teal-l);color:var(--teal)}
.b-gray{background:#f1f5f9;color:#475569}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .16s ease}
.modal.wide{max-width:820px}.modal.xwide{max-width:1050px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{margin:0;font-size:16.5px;font-weight:600}
.modal-b{padding:22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.x-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;width:auto}
.x-btn:hover{background:var(--panel2);color:var(--text)}
/* week */
.week-scroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 200px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
.week-grid{display:grid;min-width:1050px}
.wg-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;min-height:92px;position:relative}
.wg-head{background:var(--panel2);font-weight:600;font-size:12.5px;padding:10px 8px;border-right:1px solid var(--line);
  border-bottom:2px solid var(--line2);position:sticky;top:0;z-index:2;text-align:center}
.wg-head.today{background:var(--brand-l);color:var(--brand-d)}
.wg-emp{background:var(--panel2);font-weight:600;font-size:12.5px;padding:10px 12px;border-right:2px solid var(--line2);
  border-bottom:1px solid var(--line);position:sticky;left:0;z-index:1;display:flex;align-items:center;min-width:160px}
.wg-emp.corner{z-index:3;border-bottom:2px solid var(--line2);top:0}
.wg-day{cursor:pointer;transition:background .1s}
.wg-day:hover{background:var(--brand-l)}
.wg-day.weekend{background:#fafbfc}.wg-day.today{background:#eff6ff}
.chip{font-size:11px;padding:4px 7px;border-radius:6px;margin-bottom:4px;cursor:grab;line-height:1.3;border-left:3px solid;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);position:relative}
.chip:active{cursor:grabbing}
.chip.frei{background:var(--amber-l);border-left-color:var(--amber)}
.chip .cn{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
.chip .cs{color:var(--muted);font-size:10px;display:block}
.chip .cby{color:#94a3b8;font-size:9px;display:block;margin-top:1px}
.chip .ausland{position:absolute;top:3px;right:5px;font-size:9px}
.wg-day.drop-hover{background:var(--green-l);outline:2px dashed var(--green);outline-offset:-2px}
.add-hint{color:var(--line2);font-size:20px;text-align:center;line-height:74px;opacity:0;transition:opacity .1s}
.wg-day:hover .add-hint{opacity:1}
.flex{display:flex;align-items:center;gap:10px}.flex.wrap{flex-wrap:wrap}
.spacer{flex:1}.muted{color:var(--muted)}.mini{font-size:12px}
.pill-tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.pill-tabs button{border:none;background:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);font-family:inherit}
.pill-tabs button.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.progress{height:7px;background:var(--line);border-radius:20px;overflow:hidden;min-width:60px}
.progress > div{height:100%;background:var(--brand);border-radius:20px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;font-size:12.5px}
.tag button{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;width:auto;font-size:14px;line-height:1}
.tag button:hover{color:var(--red)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:15px;font-weight:600;color:#334155;margin-bottom:6px}
.search{max-width:260px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .name{width:150px;font-size:12.5px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--panel2);border-radius:6px;height:24px;position:relative;overflow:hidden;display:flex}
.bar-seg{height:100%;display:flex;align-items:center;padding:0 6px;font-size:11px;color:#fff;font-weight:600;min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.notify-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:var(--shadow-lg);animation:pop .2s}
.rec-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.diffcol{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0f172a,#1e293b)}
.ver-badge{font-size:10px;font-weight:600;color:#cbd5e1;background:rgba(148,163,184,.18);border:1px solid rgba(148,163,184,.3);padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.3px}
.btn.nav-wk{border-color:var(--brand);color:var(--brand-d,#1d4ed8);font-weight:600;background:var(--brand-l,#eff6ff)}
.btn.nav-wk:hover{background:var(--brand);color:#fff}
.ro-val{padding:8px 10px;background:var(--panel2,#f8fafc);border:1px solid var(--line);border-radius:8px;font-size:13px;min-height:18px}
.auth-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:440px;padding:32px}
.auth-card.wide{max-width:720px}
.auth-card h1{font-size:21px;margin:0 0 4px}
.auth-card .lead{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sql-box{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;max-height:260px;overflow:auto;white-space:pre;margin:8px 0}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;margin-right:8px;flex-shrink:0}
.err{background:var(--red-l);color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.send-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
@media(max-width:820px){
  .row2,.row3{grid-template-columns:1fr}
  .page{padding:14px 12px 80px}.page.wide{padding:10px 8px 80px}
  /* iOS: >=16px verhindert Auto-Zoom beim Fokus */
  input,select,textarea{font-size:16px;padding:11px 12px}
  .btn{padding:11px 14px}.btn.sm{padding:9px 12px;font-size:13px}
  /* Top-Navigation */
  .topnav{height:52px;padding:0 10px;gap:2px}
  .topnav .brand{font-size:14px;margin-right:8px}
  .topnav .brand small{display:none}
  .tab{padding:9px 12px}
  .tnav-user{font-size:11px;gap:6px}
  .tnav-user span{display:none}
  /* Modals als (fast) Vollbild-Sheets */
  .overlay{padding:0;align-items:flex-end}
  .modal,.modal.wide,.modal.xwide{max-width:100%;width:100%;border-radius:16px 16px 0 0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;animation:sheet .2s ease}
  .modal-b{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  .modal-h{padding:15px 16px}.modal-f{padding:12px 16px;position:sticky;bottom:0}
  .modal-f .btn{flex:1;justify-content:center;min-width:120px}
  /* Höhen an mobile Viewports (dvh gegen springende Adressleiste) */
  .week-scroll{max-height:calc(100vh - 240px);max-height:calc(100dvh - 240px)}
  .tbl-wrap{max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px)}
  /* Wochen-/Technikraster kompakter, weiter horizontal scrollbar */
  .week-grid{min-width:720px}
  .wg-emp{min-width:120px;padding:9px 8px;font-size:12px}
  .wg-cell{min-height:80px}
  .chip{padding:5px 7px}
  thead th,tbody td{padding:9px 10px}
  .search{max-width:100%;flex:1 1 100%}
  .card-b{padding:14px}
}
@media(max-width:560px){
  .topnav .brand{margin-right:4px}
  .tab{padding:8px 10px;font-size:13px;gap:6px}
  .wg-emp{min-width:104px}
  .stat .val{font-size:23px}
  h2.ttl{font-size:17px}
  .modal-f{flex-wrap:wrap}
}
@keyframes sheet{from{opacity:.4;transform:translateY(24px)}to{opacity:1;transform:none}}
</style>
</head>

function assignmentPdfLines(a,projects,F){
  F=F||DEFAULT_PDF_FIELDS;
  if(a.type==="frei"&&a.privat){const l=["Geblockt"];if(F.zeit!==false)l.push(a.allDay===false&&a.startTime?(a.startTime+(a.endTime?"–"+a.endTime:"")+" Uhr"):"ganztägig");return l;}
  const ps=(a.projectNrs||[]).map(nr=>projects.find(p=>p.nr===nr)).filter(Boolean);
  const lines=[];
  const label=a.type==="frei"?(a.title||"Freier Termin"):(ps.map(p=>p.name||p.alias).join(", ")||"Projekt");
  if(F.kunde!==false)lines.push(label);
  const meta=[];
  if(F.einsatzstatus!==false){const es=a.projektrolle||a.einsatz;if(es)meta.push(es);}
  if(F.zeit!==false)meta.push(a.allDay===false&&a.startTime?(a.startTime+(a.endTime?"–"+a.endTime:"")+" Uhr"):"ganztägig");
  if(F.versicherung!==false){const v=[...new Set(ps.map(p=>p.versicherung).filter(Boolean))];if(v.length)meta.push("Vers.: "+v.join(", "));}
  if(a.ort==="ausland")meta.push("Ausland");
  if(meta.length)lines.push(meta.join(" · "));
  if(F.adresse!==false){const adrs=[...new Set([...ps.filter(p=>p.adresse).map(p=>p.adresse),a.adresse].filter(Boolean))];adrs.forEach(ad=>lines.push("Adresse: "+ad));}
  if(F.hinweis!==false&&a.note)lines.push("Hinweis: "+a.note);
  return lines;
}

/* ============ Date helpers ============ */
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function isoYear(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);return d.getUTCFullYear();}
function mondayOfWeek(year,week){const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow=simple.getUTCDay();const monday=new Date(simple);
  if(dow<=4)monday.setUTCDate(simple.getUTCDate()-simple.getUTCDay()+1);
  else monday.setUTCDate(simple.getUTCDate()+8-simple.getUTCDay());return monday;}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDaysYMD(s,n){const[y,m,d]=s.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return ymd(dt);}
function datesBetween(a,b){const out=[];let cur=a;let guard=0;while(cur<=b&&guard<60){out.push(cur);cur=addDaysYMD(cur,1);guard++;}return out;}
function fmtDE(s){if(!s)return"–";const[y,m,d]=String(s).split("-");return d+"."+m+"."+y;}
function fmtDEShort(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");}
const DAYNAMES=["Mo","Di","Mi","Do","Fr","Sa","So"];
const todayYMD=ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const PROJECT_INACTIVE_STATUS=["Finance","Beendet","fiktiv"];
function isActiveProject(p){
  if(!p)return false;
  if(PROJECT_INACTIVE_STATUS.includes(p.status))return false;      // Finance/Beendet/fiktiv = nicht aktiv
  if(p.enddatum&&String(p.enddatum)<todayYMD)return false;         // Enddatum in der Vergangenheit = nicht aktiv
  return true;
}

/* ============ ROOT ============ */
function Root(){
  const[cfg,setCfg]=useState(getConfig());
  const[sb,setSb]=useState(null);const[session,setSession]=useState(null);const[booting,setBooting]=useState(true);
  const[recovery,setRecovery]=useState(()=>/type=recovery/.test(window.location.hash||""));
  useEffect(()=>{
    if(!cfg.url||!cfg.key){setBooting(false);return;}
    let client;try{client=supabase.createClient(cfg.url,cfg.key);}catch(e){setBooting(false);return;}
    setSb(client);
    client.auth.getSession().then(({data})=>{setSession(data.session);setBooting(false);});
    const{data:sub}=client.auth.onAuthStateChange((e,s)=>{setSession(s);if(e==="PASSWORD_RECOVERY")setRecovery(true);});
    return()=>sub.subscription.unsubscribe();
  },[cfg]);
  if(booting)return<div className="center-screen"><div className="spin"></div></div>;
  if(!cfg.url||!cfg.key)return<Setup onSaved={()=>setCfg(getConfig())}/>;
  if(recovery&&sb)return<SetPassword sb={sb} onDone={()=>{setRecovery(false);try{history.replaceState(null,"",location.origin+location.pathname);}catch(e){}}}/>;
  if(!session)return<Login sb={sb}/>;
  return<App sb={sb} session={session}/>;
}

function SetPassword({sb,onDone}){
  const[pw,setPw]=useState("");const[pw2,setPw2]=useState("");const[err,setErr]=useState("");const[ok,setOk]=useState(false);const[busy,setBusy]=useState(false);
  async function save(){setErr("");
    if(pw.length<8){setErr("Bitte mindestens 8 Zeichen wählen.");return;}
    if(pw!==pw2){setErr("Die beiden Passwörter stimmen nicht überein.");return;}
    setBusy(true);const{error}=await sb.auth.updateUser({password:pw});setBusy(false);
    if(error){setErr(error.message);return;}setOk(true);}
  if(ok)return(<div className="center-screen"><div className="auth-card">
    <h1>Passwort geändert ✓</h1><p className="lead">Dein neues Passwort ist gespeichert. Du bist jetzt angemeldet.</p>
    <button className="btn primary" style={{width:"100%"}} onClick={onDone}>Weiter zur App</button>
    <p className="mini muted" style={{marginTop:12,textAlign:"center"}}>Version {APP_VERSION}</p></div></div>);
  return(<div className="center-screen"><div className="auth-card">
    <h1>Neues Passwort setzen</h1><p className="lead">Vergib ein neues Passwort für deinen Zugang.</p>
    {err&&<div className="err">{err}</div>}
    <div className="field"><label>Neues Passwort</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)}/></div>
    <div className="field"><label>Neues Passwort wiederholen</label><input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/></div>
    <button className="btn primary" style={{width:"100%"}} onClick={save} disabled={busy}>{busy?"Speichern…":"Passwort speichern"}</button>
    <p className="mini muted" style={{marginTop:12,textAlign:"center"}}>Version {APP_VERSION} · {APP_VERSION_DATE}</p>
  </div></div>);
}

  async function submit(){setErr("");setInfo("");setBusy(true);const{error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});setBusy(false);if(error)setErr(error.message);}
  async function forgot(){setErr("");setInfo("");
    if(!email.trim()){setErr("Bitte zuerst deine E-Mail-Adresse eingeben.");return;}
    const{error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
    if(error)setErr(error.message);else setInfo("E-Mail zum Zurücksetzen des Passworts wurde gesendet (bitte auch den Spam-Ordner prüfen).");}
  return(<div className="center-screen"><div className="auth-card">
    <h1>DRS Personalmanagement</h1><p className="lead">Bitte anmelden.</p>
    {err&&<div className="err">{err}</div>}
    {info&&<div style={{background:"var(--green-l)",color:"var(--green)",padding:"9px 12px",borderRadius:8,fontSize:13,marginBottom:12}}>{info}</div>}
    <div className="field"><label>Benutzername (E-Mail)</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
    <div className="field"><label>Passwort</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
    <button className="btn primary" style={{width:"100%"}} onClick={submit} disabled={busy}>{busy?"Anmelden…":"Einloggen"}</button>
    <p className="mini muted" style={{marginTop:16,textAlign:"center"}}>
      <a href="#" onClick={e=>{e.preventDefault();forgot();}}>Passwort vergessen?</a></p>
    <p className="mini muted" style={{marginTop:8,textAlign:"center"}}>Version {APP_VERSION} · {APP_VERSION_DATE}</p>
  </div></div>);
}

/* ============ APP ============ */
function MitarbeiterView({store,empId,emp,sb,canExit}){
  const{rolePlanung}=store;
  if(!emp)return(<div className="center-screen"><div className="auth-card">
    <h2 style={{marginTop:0}}>Plan nicht gefunden</h2>
    <p className="muted">Dieser persönliche Link ist ungültig oder der Mitarbeiter wurde entfernt.</p>
    <a className="btn primary" href={location.origin+location.pathname}>Zur Startseite</a></div></div>);
  const week=showsInWeek(emp,rolePlanung),tech=showsInTech(emp,rolePlanung);
  const showWeek=week||(!week&&!tech);
  const first=(emp.name||"").includes(",")?emp.name.split(",")[1].trim():emp.name;
  return(<div>
    <div className="topnav">
      <div className="brand">Mein Plan <small>{emp.name}</small> <span className="ver-badge" title={"Version "+APP_VERSION+" · "+APP_VERSION_DATE}>{APP_VERSION}</span></div>
      <span className="spacer"></span>
      <div className="tnav-user">
        {canExit&&<a className="btn sm" href={location.origin+location.pathname}>Volle Ansicht</a>}
        <button className="btn sm" onClick={()=>sb.auth.signOut()}><Ic d={ICONS.logout}/> Abmelden</button></div>
    </div>
    <div className="page wide">
      <h2 className="ttl">Hallo {first} 👋</h2>
      <div className="sub">Dein persönlicher Einsatzplan – tippe auf einen Tag für Details, Route und Kalender-Export. Neue Termine legst du per Tipp auf einen leeren Tag an.</div>
      {showWeek&&<Wochenplanung store={store} soloEmp={empId}/>}
      {tech&&<div style={{marginTop:26}}><Technikerplanung store={store} soloEmp={empId}/></div>}
    </div>
  </div>);
}
function App({sb,session}){
  const[tab,setTab]=useState("dash");
  const[loading,setLoading]=useState(true);const[loadErr,setLoadErr]=useState("");
  const[employees,setEmployees]=useState([]);const[projects,setProjects]=useState([]);
  const[assignments,setAssignments]=useState([]);
  const[techAssignments,setTechAssignments]=useState([]);
  const[absences,setAbsences]=useState([]);
  const[roles,setRoles]=useState(DEFAULT_ROLES);const[einsatz,setEinsatz]=useState(DEFAULT_EINSATZ);
  const[typen,setTypen]=useState(DEFAULT_TYPEN);const[appUrl,setAppUrl]=useState("");
  const[workdays,setWorkdays]=useState(DEFAULT_WORKDAYS);const[versicherungen,setVersicherungen]=useState(DEFAULT_VERS);
  const[awCapacity,setAwCapacity]=useState(0);const[rolePlanung,setRolePlanung]=useState({});
  const[pdfFields,setPdfFields]=useState(DEFAULT_PDF_FIELDS);
  const[appUsers,setAppUsers]=useState([]);const[loginLog,setLoginLog]=useState([]);const[changeLog,setChangeLog]=useState([]);
  const[rolePerm,setRolePerm]=useState({});
  const[toast,showToast]=useToast();const[schemaWarn,setSchemaWarn]=useState(false);
  const myEmail=session.user.email;
  const fail=(error)=>{const m=error?.message||"Unbekannter Fehler";
    if(/column|schema cache|could not find/i.test(m))setSchemaWarn(true);showToast("Fehler: "+m);return false;};

  async function reload(){
    setLoading(true);setLoadErr("");
    try{
      const[e,p,a,s]=await Promise.all([
        sb.from("employees").select("*").order("name"),
        sb.from("projects").select("*").order("nr",{ascending:false}),
        sb.from("assignments").select("*"),
        sb.from("settings").select("*")]);
      for(const r of[e,p,a,s])if(r.error)throw r.error;
      setEmployees(e.data||[]);setProjects((p.data||[]).map(projFromDb));
      setAssignments((a.data||[]).map(asgFromDb));
      const sm={};(s.data||[]).forEach(r=>sm[r.key]=r.value);
      setRoles(sm.roles||DEFAULT_ROLES);setEinsatz(sm.einsatz||DEFAULT_EINSATZ);
      setTypen(sm.typen||DEFAULT_TYPEN);setAppUrl(sm.app_url||"");
      setWorkdays(Array.isArray(sm.workdays)&&sm.workdays.length?sm.workdays:DEFAULT_WORKDAYS);
      setVersicherungen(Array.isArray(sm.versicherungen)?sm.versicherungen:DEFAULT_VERS);
      setAwCapacity(Number(sm.aw_capacity)||0);
      setPdfFields(sm.pdf_fields&&typeof sm.pdf_fields==="object"&&!Array.isArray(sm.pdf_fields)?{...DEFAULT_PDF_FIELDS,...sm.pdf_fields}:DEFAULT_PDF_FIELDS);
      setRolePlanung(sm.role_planung&&typeof sm.role_planung==="object"&&!Array.isArray(sm.role_planung)?sm.role_planung:{});
      setRolePerm(sm.role_permissions&&typeof sm.role_permissions==="object"&&!Array.isArray(sm.role_permissions)?sm.role_permissions:{});
      const au=await sb.from("app_users").select("*");
      if(au.error){if(/relation|does not exist|schema cache|could not find/i.test(au.error.message||""))setSchemaWarn(true);setAppUsers([]);}
      else setAppUsers((au.data||[]).map(userFromDb));
      const ll=await sb.from("login_log").select("*").order("ts",{ascending:false}).limit(200);
      if(!ll.error)setLoginLog(ll.data||[]);
      const cl=await sb.from("change_log").select("*").order("ts",{ascending:false}).limit(300);
      if(!cl.error)setChangeLog(cl.data||[]);
      // Technikerplanung getrennt laden (Tabelle existiert evtl. noch nicht → tolerant)
      const t=await sb.from("tech_assignments").select("*");
      if(t.error){if(/relation|does not exist|schema cache|could not find/i.test(t.error.message||""))setSchemaWarn(true);setTechAssignments([]);}
      else setTechAssignments((t.data||[]).map(techFromDb));
      const ab=await sb.from("absences").select("*");
      if(ab.error){if(/relation|does not exist|schema cache|could not find/i.test(ab.error.message||""))setSchemaWarn(true);setAbsences([]);}
      else setAbsences((ab.data||[]).map(absFromDb));
    }catch(err){setLoadErr(err.message||"Ladefehler");}
    setLoading(false);
  }
  useEffect(()=>{reload();},[]);
  const loggedRef=useRef(false);
  useEffect(()=>{if(loading||loggedRef.current)return;loggedRef.current=true;
    (async()=>{try{await sb.from("login_log").insert({email:myEmail,user_agent:navigator.userAgent});}catch(e){}})();
  },[loading]);
  const logChange=async(action,details)=>{try{const{data}=await sb.from("change_log").insert({user_email:myEmail,action,details:details||""}).select().single();if(data)setChangeLog(cl=>[data,...cl]);}catch(e){}};

  const api={
    async saveEmployee(rec,isNew){
      const cols={name:rec.name,email:rec.email,phone:rec.phone,role:rec.role,adresse:rec.adresse||"",
        pass_gueltig:rec.passGueltig||null,freigabe_inland:rec.freigabeInland!==false,
        freigabe_ausland:!!rec.freigabeAusland,gesperrt:!!rec.gesperrt};
      if(isNew){const{data,error}=await sb.from("employees").insert(cols).select().single();
        if(error)return fail(error);setEmployees(es=>[...es,data].sort((a,b)=>a.name.localeCompare(b.name)));showToast("Mitarbeiter angelegt");return true;}
      else{const{error}=await sb.from("employees").update(cols).eq("id",rec.id);
        if(error)return fail(error);setEmployees(es=>es.map(e=>e.id===rec.id?{...e,...cols}:e).sort((a,b)=>a.name.localeCompare(b.name)));showToast("Gespeichert");logChange("Mitarbeiter geändert",cols.name+(cols.gesperrt?" · gesperrt":""));return true;}},
    async deleteEmployee(id){const{error}=await sb.from("employees").delete().eq("id",id);
      if(error)return fail(error);setEmployees(es=>es.filter(e=>e.id!==id));setAssignments(as=>as.filter(a=>a.employeeId!==id));setAbsences(ab=>ab.filter(a=>a.employeeId!==id));showToast("Mitarbeiter gelöscht");return true;},
    async addAbsence(rec){
      const{data,error}=await sb.from("absences").insert(absToDb({...rec,createdBy:myEmail})).select().single();
      if(error)return fail(error);setAbsences(ab=>[...ab,absFromDb(data)]);showToast("Abwesenheit gespeichert");return true;},
    async deleteAbsence(id){const{error}=await sb.from("absences").delete().eq("id",id);
      if(error)return fail(error);setAbsences(ab=>ab.filter(a=>a.id!==id));showToast("Abwesenheit gelöscht");return true;},
    async saveProject(rec,isNew){
      if(isNew){const{error}=await sb.from("projects").insert(projToDb(rec));if(error)return fail(error);setProjects(ps=>[rec,...ps]);showToast("Projekt angelegt");logChange("Projekt angelegt",rec.nr+" · "+rec.name);return true;}
      else{const{error}=await sb.from("projects").update(projToDb(rec)).eq("nr",rec.nr);if(error)return fail(error);setProjects(ps=>ps.map(p=>p.nr===rec.nr?rec:p));showToast("Projekt gespeichert");logChange("Projekt geändert",rec.nr+" · Status "+rec.status);return true;}},
    async deleteProject(nr){const{error}=await sb.from("projects").delete().eq("nr",nr);if(error)return fail(error);setProjects(ps=>ps.filter(p=>p.nr!==nr));showToast("Projekt gelöscht");return true;},
    async upsertProjects(newList,updateList){
      const all=[...newList,...updateList];if(!all.length)return{add:0,upd:0};
      const{error}=await sb.from("projects").upsert(all.map(projToDb),{onConflict:"nr"});if(error){fail(error);return null;}
      setProjects(ps=>{let out=[...ps];newList.forEach(it=>out.unshift(it));updateList.forEach(it=>{out=out.map(p=>p.nr===it.nr?{...p,...it}:p);});return out;});
      return{add:newList.length,upd:updateList.length};},
    async addAssignments(list){
      const rows=list.map(a=>asgToDb({...a,createdBy:myEmail}));
      const{data,error}=await sb.from("assignments").insert(rows).select();
      if(error)return fail(error);
      setAssignments(as=>[...as,...(data||[]).map(asgFromDb)]);
      showToast(list.length>1?(list.length+" Einsätze angelegt"):"Einsatz angelegt");logChange("Termin erstellt",list.length+" Einsatz/Einsätze");return true;},
    async updateAssignment(rec){
      const{error}=await sb.from("assignments").update(asgToDb(rec)).eq("id",rec.id);
      if(error)return fail(error);setAssignments(as=>as.map(a=>a.id===rec.id?rec:a));showToast("Einsatz aktualisiert");logChange("Termin geändert",rec.date);return true;},
    async deleteAssignment(id){const{error}=await sb.from("assignments").delete().eq("id",id);if(error)return fail(error);setAssignments(as=>as.filter(a=>a.id!==id));showToast("Einsatz gelöscht");logChange("Termin gelöscht","");return true;},
    async moveAssignment(id,employeeId,date){const{error}=await sb.from("assignments").update({employee_id:employeeId,date}).eq("id",id);
      if(error)return fail(error);setAssignments(as=>as.map(a=>a.id===id?{...a,employeeId,date}:a));return true;},
    async handOver(id,newEmpId,name){const{error}=await sb.from("assignments").update({employee_id:newEmpId}).eq("id",id);
      if(error)return fail(error);setAssignments(as=>as.map(a=>a.id===id?{...a,employeeId:newEmpId}:a));showToast("Übergeben an "+name);logChange("Termin übergeben","an "+name);return true;},
    async copyWeek(sourceDates){
      const src=assignments.filter(a=>sourceDates.includes(a.date));
      if(!src.length){showToast("Keine Einsätze zum Kopieren");return false;}
      const rows=src.map(a=>asgToDb({employeeId:a.employeeId,date:addDaysYMD(a.date,7),type:a.type,projectNrs:a.projectNrs,
        einsatz:a.einsatz,title:a.title,ort:a.ort,allDay:a.allDay,startTime:a.startTime,endTime:a.endTime,notes:a.notes,createdBy:myEmail}));
      const{data,error}=await sb.from("assignments").insert(rows).select();
      if(error)return fail(error);setAssignments(as=>[...as,...(data||[]).map(asgFromDb)]);showToast(src.length+" Einsätze in Folgewoche kopiert");return true;},
    async setSetting(key,value){
      const setter={roles:setRoles,einsatz:setEinsatz,typen:setTypen,app_url:setAppUrl,workdays:setWorkdays,versicherungen:setVersicherungen,aw_capacity:setAwCapacity,role_planung:setRolePlanung,role_permissions:setRolePerm,pdf_fields:setPdfFields}[key];if(setter)setter(value);
      const{error}=await sb.from("settings").upsert({key,value},{onConflict:"key"});if(error)return fail(error);return true;},
    logChange,
    async saveUser(rec,isNew){
      const row=userToDb(rec);
      const{error}=await sb.from("app_users").upsert(row,{onConflict:"email"});if(error)return fail(error);
      setAppUsers(us=>{const ex=us.some(u=>u.email===row.email);return ex?us.map(u=>u.email===row.email?userFromDb(row):u):[...us,userFromDb(row)];});
      logChange(isNew?"Nutzer angelegt":"Nutzer geändert",row.email+" · "+row.rolle);showToast("Nutzer gespeichert");return true;},
    async deleteUser(email){const{error}=await sb.from("app_users").delete().eq("email",email);if(error)return fail(error);
      setAppUsers(us=>us.filter(u=>u.email!==email));logChange("Nutzer gelöscht",email);showToast("Nutzer gelöscht");return true;},
    async setRolePerm(next){const{error}=await sb.from("settings").upsert({key:"role_permissions",value:next},{onConflict:"key"});if(error)return fail(error);
      setRolePerm(next);logChange("Benutzerrechte geändert","");return true;},
    async addTech(list){
      const rows=list.map(t=>techToDb({...t,createdBy:myEmail}));
      const{data,error}=await sb.from("tech_assignments").insert(rows).select();
      if(error)return fail(error);setTechAssignments(ts=>[...ts,...(data||[]).map(techFromDb)]);
      showToast(list.length>1?(list.length+" Technikertermine angelegt"):"Technikertermin angelegt");logChange("Technikertermin erstellt",list.length+"x");return true;},
    async updateTech(rec){
      const{error}=await sb.from("tech_assignments").update(techToDb(rec)).eq("id",rec.id);
      if(error)return fail(error);setTechAssignments(ts=>ts.map(t=>t.id===rec.id?rec:t));showToast("Technikertermin aktualisiert");return true;},
    async deleteTech(id){const{error}=await sb.from("tech_assignments").delete().eq("id",id);if(error)return fail(error);setTechAssignments(ts=>ts.filter(t=>t.id!==id));showToast("Technikertermin gelöscht");return true;},
    async moveTech(id,employeeId,date){const{error}=await sb.from("tech_assignments").update({employee_id:employeeId,date}).eq("id",id);
      if(error)return fail(error);setTechAssignments(ts=>ts.map(t=>t.id===id?{...t,employeeId,date}:t));return true;},
    async logTechSend(id,channel){
      const cur=techAssignments.find(t=>t.id===id);if(!cur)return false;
      const sendLog=[...(cur.sendLog||[]),{ts:new Date().toISOString(),channel,by:myEmail}];
      const{error}=await sb.from("tech_assignments").update({send_log:sendLog}).eq("id",id);
      if(error)return fail(error);setTechAssignments(ts=>ts.map(t=>t.id===id?{...t,sendLog}:t));logChange("Einsatzplanung versendet",channel);return true;},
    async copyTechWeek(sourceDates){
      const src=techAssignments.filter(t=>sourceDates.includes(t.date));
      if(!src.length){showToast("Keine Technikertermine zum Kopieren");return false;}
      const rows=src.map(t=>techToDb({...t,date:addDaysYMD(t.date,7),sendLog:[],createdBy:myEmail}));
      const{data,error}=await sb.from("tech_assignments").insert(rows).select();
      if(error)return fail(error);setTechAssignments(ts=>[...ts,...(data||[]).map(techFromDb)]);showToast(src.length+" Termine in Folgewoche kopiert");return true;},
    async seed(){
      const existing=new Set(employees.map(e=>e.name));
      const toAdd=SEED.employees.filter(n=>!existing.has(n)).map((n,i)=>({name:n,email:"",phone:"",role:n.includes("SPM")?"Projektleiter":(i%4===0?"Projektleiter":"Techniker")}));
      if(toAdd.length){const{error}=await sb.from("employees").insert(toAdd);if(error)return showToast("Fehler: "+error.message);}
      const{error:pe}=await sb.from("projects").upsert(SEED.projects.map(projToDb),{onConflict:"nr"});if(pe)return showToast("Fehler: "+pe.message);
      await sb.from("settings").upsert([{key:"roles",value:DEFAULT_ROLES},{key:"einsatz",value:DEFAULT_EINSATZ},{key:"typen",value:DEFAULT_TYPEN}],{onConflict:"key"});
      showToast("Startdaten geladen");reload();},
  };

  const currentUser=appUsers.find(u=>u.email===(myEmail||"").toLowerCase());
  const isBootstrap=appUsers.length===0;
  const perm=isBootstrap?permObj(PERM_KEYS):(currentUser?effectivePerms(currentUser,rolePerm):effectivePerms({rolle:"Betrachter"},rolePerm));
  const can=k=>!!perm[k];
  const myEmployeeId=(currentUser&&currentUser.employeeId)||((employees.find(e=>(e.email||"").toLowerCase()===(myEmail||"").toLowerCase())||{}).id)||"";
  const canTermFor=empId=>(empId&&myEmployeeId&&empId===myEmployeeId)?can("term_own"):can("term_others");
  const isAdmin=isBootstrap||["Super-Admin","Admin"].includes(currentUser&&currentUser.rolle);
  const store={employees,projects,assignments,techAssignments,absences,roles,einsatz,typen,appUrl,workdays,versicherungen,awCapacity,rolePlanung,pdfFields,appUsers,loginLog,changeLog,rolePerm,currentUser,isBootstrap,isAdmin,perm,can,myEmployeeId,canTermFor,api,showToast,session,myEmail,reload,schemaWarn};

  const NAV=[["dash","Dashboard",ICONS.dash,true],["week","Wochenplanung",ICONS.week,can("term_view")],
    ["tech","Technikerplanung",ICONS.tech,can("term_view")],["proj","Projekte",ICONS.proj,can("proj_view")],
    ["emp","Mitarbeiter",ICONS.emp,can("emp_edit")||can("users_manage")],["stat","Statistik",ICONS.stat,can("reports_view")],
    ["users","Nutzer",ICONS.users,can("users_manage")||isBootstrap],["logs","Protokolle",ICONS.book,can("logs_view")],
    ["set","Einstellungen",ICONS.set,can("vers_edit")]].filter(x=>x[3]);
  const allowedTabs=NAV.map(x=>x[0]);
  const activeTab=allowedTabs.includes(tab)?tab:"dash";
  // „Nur eigene": Mitarbeiter/Techniker mit Recht eigene Termine, aber ohne fremde → dürfen NUR den eigenen Plan sehen
  const selfOnly=!isBootstrap&&can("term_own")&&!can("term_others");
  const maParam=new URLSearchParams(window.location.search).get("ma")||"";
  const soloEmpId=selfOnly?(myEmployeeId||"__none__"):maParam;
  if(selfOnly&&!myEmployeeId&&!loading&&!loadErr){
    return(<><div className="center-screen"><div className="auth-card">
      <div className="brand" style={{marginBottom:8}}>Mein Plan <span className="ver-badge">{APP_VERSION}</span></div>
      <h2 style={{marginTop:0}}>Kein Mitarbeiter verknüpft</h2>
      <p className="muted">Dein Zugang ist noch keinem Mitarbeiter-Eintrag zugeordnet. Bitte wende dich an die Planung (Nutzerverwaltung → dein Konto → „Verknüpfter Mitarbeiter").</p>
      <button className="btn" onClick={()=>sb.auth.signOut()}>Abmelden</button></div></div>{toast}</>);
  }
  if(soloEmpId&&!loading&&!loadErr){
    return(<><MitarbeiterView store={store} empId={soloEmpId} emp={employees.find(e=>e.id===soloEmpId)} sb={sb} canExit={!selfOnly&&(can("term_others")||isBootstrap)}/>{toast}</>);
  }

  return(<div>
    <div className="topnav">
      <div className="brand">DRS Personal <small>Management</small> <span className="ver-badge" title={"Version "+APP_VERSION+" · "+APP_VERSION_DATE}>{APP_VERSION}</span></div>
      <div className="tnav">{NAV.map(([k,l,ic])=>(
        <button key={k} className={"tab"+(activeTab===k?" active":"")} onClick={()=>setTab(k)}><Ic d={ic}/>{l}</button>))}</div>
      <div className="tnav-user">
        <span style={{maxWidth:200,overflow:"hidden",textOverflow:"ellipsis"}}>{session.user.email}{currentUser?" · "+currentUser.rolle:(isBootstrap?" · Super-Admin":"")}</span>
        <button className="btn sm" onClick={()=>sb.auth.signOut()}><Ic d={ICONS.logout}/> Abmelden</button></div>
    </div>
    <div className={"page"+((activeTab==="week"||activeTab==="tech")?" wide":"")}>
      {schemaWarn&&<div className="card" style={{marginBottom:16,borderColor:"var(--red)",borderWidth:2}}><div className="card-b">
        <div style={{fontWeight:700,color:"var(--red)",marginBottom:6}}>⚠ Datenbank muss aktualisiert werden</div>
        <p className="mini" style={{marginTop:0}}>Beim Speichern/Laden fehlen Spalten oder Tabellen. Führe dieses Skript einmalig im Supabase <b>SQL-Editor</b> aus, dann diese Seite neu laden.</p>
        <div className="sql-box">{MIGRATION_SQL}</div>
        <div className="flex"><button className="btn sm" onClick={()=>{navigator.clipboard.writeText(MIGRATION_SQL);showToast("SQL kopiert");}}>Update-SQL kopieren</button>
          <button className="btn sm" onClick={()=>window.location.reload()}>Neu laden</button>
          <button className="btn ghost sm" onClick={()=>setSchemaWarn(false)}>Ausblenden</button></div></div></div>}
      {loading?<div className="spin"></div>:
       loadErr?<div className="card"><div className="card-b"><div className="err">Fehler beim Laden: {loadErr}</div>
         <button className="btn" onClick={reload}>Erneut versuchen</button>
         <p className="mini muted" style={{marginTop:10}}>Falls Spalten fehlen (z. B. „alias"), führe das Update-Skript unter Einstellungen aus.</p></div></div>:<>
        {activeTab==="dash"&&<Dashboard store={store} go={setTab}/>}
        {activeTab==="week"&&<Wochenplanung store={store}/>}
        {activeTab==="tech"&&<Technikerplanung store={store}/>}
        {activeTab==="proj"&&<Projekte store={store}/>}
        {activeTab==="emp"&&<Mitarbeiter store={store}/>}
        {activeTab==="stat"&&<Statistik store={store}/>}
        {activeTab==="users"&&<Nutzerverwaltung store={store}/>}
        {activeTab==="logs"&&<Protokolle store={store}/>}
        {activeTab==="set"&&<Einstellungen store={store}/>}

function projLabel(p){return p?(p.alias||p.name):"";}
function timeLabel(a){return a.allDay===false&&a.startTime?(a.startTime+(a.endTime?"–"+a.endTime:"")):"";}
function shortCreator(email){if(!email)return"";return email.split("@")[0];}
function assignmentProjects(a,projects){return(a.projectNrs||[]).map(nr=>projects.find(p=>p.nr===nr)).filter(Boolean);}
function timeKey(a){return(a&&a.allDay===false&&a.startTime)?a.startTime:"99:99";}
function sortByTime(list){return[...(list||[])].sort((x,y)=>timeKey(x).localeCompare(timeKey(y)));}
function unavailableWholeWeek(empId,weekDates,absences){
  if(!weekDates||!weekDates.length)return false;
  return weekDates.every(d=>(absences||[]).some(a=>a.employeeId===empId&&d>=a.von&&d<=a.bis));}
function personalLink(empId,appUrl){
  let base=(appUrl&&String(appUrl).trim())?String(appUrl).trim():(location.origin+location.pathname);
  base=base.split("#")[0];const sep=base.includes("?")?"&":"?";
  return base+sep+"ma="+encodeURIComponent(empId);}
function isPrivateHidden(a,isAdmin){return a&&a.type==="frei"&&a.privat&&!isAdmin;}
function collectDayStops(empId,date,assignments,techAssignments,projects){
  const items=[];
  (assignments||[]).filter(a=>a.employeeId===empId&&a.date===date).forEach(a=>{
    if(a.type==="frei")return; // freie/private Termine haben i. d. R. keine Kundenadresse für die Route
    const ps=assignmentProjects(a,projects);
    [...ps.map(p=>p.adresse).filter(Boolean)].forEach(ad=>items.push({t:a.allDay===false?(a.startTime||""):"",ad}));
    if(a.adresse)items.push({t:a.allDay===false?(a.startTime||""):"",ad:a.adresse});
  });
  (techAssignments||[]).filter(t=>t.employeeId===empId&&t.date===date).forEach(t=>{
    if(t.adresse)items.push({t:t.allDay===false?(t.startTime||""):"",ad:t.adresse});});
  items.sort((a,b)=>(a.t||"99:99").localeCompare(b.t||"99:99"));
  const uniq=[];items.forEach(i=>{if(!uniq.length||uniq[uniq.length-1]!==i.ad)uniq.push(i.ad);});
  return uniq;
}
function dayRouteUrl(stops,start){if(!stops||!stops.length)return null;
  const pts=[...(start&&String(start).trim()?[String(start).trim()]:[]),...stops];
  return"https://www.google.com/maps/dir/"+pts.map(s=>encodeURIComponent(s)).join("/");}
function assignmentAddresses(a,projects){
  if(a.type==="frei")return a.adresse?[a.adresse]:[];
  const ps=assignmentProjects(a,projects);const arr=[...ps.map(p=>p.adresse).filter(Boolean)];
  if(a.adresse)arr.push(a.adresse);return[...new Set(arr)];}
function navRouteUrl(stops){ // Route ab aktuellem Standort (GPS)
  if(!stops||!stops.length)return null;
  if(stops.length===1)return"https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(stops[0])+"&travelmode=driving";
  return"https://www.google.com/maps/dir/"+[""].concat(stops).map(s=>s?encodeURIComponent(s):"").join("/");}
function icsDate(ymdStr,hm){const[y,m,d]=ymdStr.split("-");return y+m+d+(hm?("T"+hm.replace(":","")+"00"):"");}
function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function downloadICS(ev){
  // ev: {title, date, allDay, startTime, endTime, location, description, contactName, contactTel, contactMail}
  const uid=(Math.random().toString(36).slice(2))+"@drs-hailplanner";
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  let dtStart,dtEnd,val="";
  if(ev.allDay===false&&ev.startTime){dtStart="DTSTART:"+icsDate(ev.date,ev.startTime);dtEnd="DTEND:"+icsDate(ev.date,ev.endTime||ev.startTime);}
  else{const nx=addDaysYMD(ev.date,1);dtStart="DTSTART;VALUE=DATE:"+icsDate(ev.date);dtEnd="DTEND;VALUE=DATE:"+icsDate(nx);}
  const desc=[ev.description,ev.contactName?("Ansprechpartner: "+ev.contactName):"",ev.contactTel?("Tel: "+ev.contactTel):"",ev.contactMail?("E-Mail: "+ev.contactMail):""].filter(Boolean).join("\n");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//DRS Hailplanner//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+stamp,dtStart,dtEnd,
    "SUMMARY:"+icsEscape(ev.title),ev.location?("LOCATION:"+icsEscape(ev.location)):"",
    desc?("DESCRIPTION:"+icsEscape(desc)):"",
    ev.contactMail?("CONTACT:"+icsEscape((ev.contactName?ev.contactName+", ":"")+(ev.contactTel?ev.contactTel+", ":"")+ev.contactMail)):"",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean);
  const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=(ev.title||"Termin").replace(/[^\w äöüÄÖÜ.-]/g,"_").slice(0,60)+".ics";
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1500);}
function shortName(n){if(!n)return"";const parts=n.split(",");return parts[0].trim();}
function chipColor(a,projects,versicherungen){
  if(a.type==="frei")return"var(--amber)";
  const ps=assignmentProjects(a,projects);const vn=ps[0]?.versicherung;
  const v=(versicherungen||[]).find(x=>x.name===vn);if(v)return v.color;
  return EINSATZ_COLORS[a.einsatz]||"var(--brand)";}
function computeRoles(project,assignments,employees){
  const res={};
  PROJEKTROLLEN.forEach(role=>{
    const matches=assignments.filter(a=>a.projektrolle===role&&(a.projectNrs||[]).includes(project.nr))
      .slice().sort((x,y)=>x.date<y.date?1:(x.date>y.date?-1:0));
    if(matches.length){const cur=matches[0];const emp=employees.find(e=>e.id===cur.employeeId);
      res[role]={name:emp?emp.name:"?",date:cur.date,source:"termin",
        history:matches.map(m=>({name:(employees.find(e=>e.id===m.employeeId)||{}).name||"?",date:m.date}))};}
    else{const man=(project.rollen||{})[role];
      if(man&&(man.checked||man.name))res[role]={name:man.name||"geplant",date:null,source:"manuell",history:[]};
      else res[role]=null;}
  });
  return res;
}
function workDaysOfWeek(monday,workdays){
  const wd=(workdays&&workdays.length?workdays:DEFAULT_WORKDAYS).slice().sort((a,b)=>a-b);
  return wd.map(i=>({idx:i,date:new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i)}));
}
function roleDefault(role){const r=(role||"").toLowerCase();const tech=r.includes("techn")||r.includes("monteur");
  return tech?{woche:false,technik:true}:{woche:true,technik:false};}
function planungFor(role,map){const m=map&&map[role];return m?{woche:!!m.woche,technik:!!m.technik}:roleDefault(role);}
function showsInWeek(emp,map){return planungFor(emp.role,map).woche;}
function showsInTech(emp,map){return planungFor(emp.role,map).technik;}
function absenceOn(absences,empId,date){return(absences||[]).find(a=>a.employeeId===empId&&date>=a.von&&date<=a.bis)||null;}

      {visibleEmployees.map(emp=>(<React.Fragment key={emp.id}>

        {days.map((d,i)=>{const date=ymd(d);const items=cellItems(emp.id,date);
          const cellKey=emp.id+date;const abs=absenceOn(absences,emp.id,date);
          return(<div key={i}
            className={"wg-cell wg-day"+(dayIdx[i]>=5?" weekend":"")+(date===todayYMD?" today":"")+(dropCell===cellKey?" drop-hover":"")}
            onClick={e=>{if(e.target.closest(".chip"))return;setModal({employeeId:emp.id,date});}}
            onDragOver={e=>{e.preventDefault();setDropCell(cellKey);}}
            onDragLeave={()=>setDropCell(c=>c===cellKey?null:c)}
            onDrop={e=>{e.preventDefault();onDrop(emp.id,date);}}>
            {abs&&<div className="chip" title={abs.art+(abs.note?" · "+abs.note:"")} style={{background:ABSENCE_COLORS[abs.art]||"#64748b",color:"#fff",borderLeftColor:"rgba(0,0,0,.25)"}}>
              <span className="cn">{abs.art}</span></div>}
            {items.length>0&&(()=>{const a0=items[0];const hidden0=isPrivateHidden(a0,isAdmin);const ps0=hidden0?[]:assignmentProjects(a0,projects);
              const col=hidden0?"#94a3b8":chipColor(a0,projects,versicherungen);
              const label0=hidden0?"Geblockt":(a0.type==="frei"?(a0.title||"Freier Termin"):(ps0.map(p=>projLabel(p)).join(", ")||a0.projectNrs.join(", ")));
              const more=items.length-1;const single=items.length===1;
              return(<div className={"chip"+((a0.type==="frei"||hidden0)?" frei":"")}
                draggable={single&&!hidden0} onDragStart={()=>single&&!hidden0&&setDragId(a0.id)} onDragEnd={()=>{setDragId(null);setDropCell(null);}}
                style={{borderLeftColor:col,...(hidden0?{background:"#f1f5f9"}:{})}}
                title={more>0?items.length+" Termine – klicken zum Aufklappen":"Klicken für Details / Route"}
                onClick={e=>{e.stopPropagation();setDayPop({employeeId:emp.id,date});}}>
                <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                  {!hidden0&&a0.ort==="ausland"&&<span className="ausland" title="Ausland">✈</span>}
                  {hidden0&&<span className="ausland" title="privat">🔒</span>}
                  <span className="cn" style={{flex:1,minWidth:0}}>{label0}</span>
                  {more>0&&<span className="badge b-gray" style={{flexShrink:0,padding:"0 6px",fontSize:10}}>+{more}</span>}</div>
                <span className="cs">{[hidden0?"":(a0.projektrolle||(a0.type==="frei"?"Freier Termin":a0.einsatz)),timeLabel(a0)].filter(Boolean).join(" · ")||"—"}</span>
              </div>);})()}
            {items.length===0&&!abs&&<div className="add-hint">+</div>}
          </div>);})}
      </React.Fragment>))}
    </div></div>
    {visibleEmployees.length===0&&<div className="empty"><div className="big">Kein Mitarbeiter gefunden</div></div>}
    {modal&&<AssignModal store={store} ctx={modal} onClose={()=>setModal(null)}/>}
    {dayPop&&<DayPopup store={store} ctx={dayPop}
      onEdit={a=>{const c=dayPop;setDayPop(null);setModal({employeeId:c.employeeId,date:c.date,editing:a});}}
      onAdd={()=>{const c=dayPop;setDayPop(null);setModal({employeeId:c.employeeId,date:c.date});}}
      onClose={()=>setDayPop(null)}/>}
    {sendOpen&&<SendModal store={store} onClose={()=>setSendOpen(false)}/>}
  </div>);
}

function DayPopup({store,ctx,onEdit,onAdd,onClose}){
  const{employees,projects,assignments,techAssignments,versicherungen,isAdmin,canTermFor}=store;
  const emp=employees.find(e=>e.id===ctx.employeeId);
  const home=emp&&emp.adresse?emp.adresse:"";
  const items=sortByTime(assignments.filter(a=>a.employeeId===ctx.employeeId&&a.date===ctx.date));
  const dayStops=collectDayStops(ctx.employeeId,ctx.date,assignments,techAssignments,projects);
  const dayUrl=dayRouteUrl(dayStops,home);
  const mayEdit=canTermFor?canTermFor(ctx.employeeId):true;
  // Termine mit Adresse nach Uhrzeit sortiert → der früheste gilt als „erster Termin" (ab Wohnort)
  const timed=items.filter(a=>!isPrivateHidden(a,isAdmin)&&assignmentAddresses(a,projects).length)
    .map(a=>({a,t:a.allDay===false&&a.startTime?a.startTime:"99:99"}))
    .sort((x,y)=>x.t.localeCompare(y.t));
  const firstAddrId=timed.length?timed[0].a.id:null;
  return(<Modal title={"Termine · "+fmtDE(ctx.date)+" · "+(emp?emp.name:"")} onClose={onClose}
    footer={<><button className="btn" onClick={onClose}>Schließen</button><span className="spacer"></span>
      {mayEdit&&<button className="btn primary" onClick={onAdd}><Ic d={ICONS.plus}/> Einsatz hinzufügen</button>}</>}>
    {dayUrl&&<div className="flex wrap" style={{gap:8,marginBottom:12}}>
      <a className="btn green" style={{flex:1,justifyContent:"center",minWidth:150}} href={dayUrl} target="_blank" rel="noopener">🧭 Tagesroute{home?" ab Wohnort":""}</a>
      <a className="btn" style={{flex:1,justifyContent:"center",minWidth:150}} href={navRouteUrl(dayStops)} target="_blank" rel="noopener">📍 Ab aktuellem Standort</a></div>}
    {dayUrl&&!home&&<div className="mini muted" style={{marginTop:-6,marginBottom:12}}>Ohne hinterlegten Wohnort startet die Tagesroute beim ersten Termin. Wohnort unter „Mitarbeiter" ergänzen – in Google Maps lässt sich der Start jederzeit ändern.</div>}
    {items.length===0&&<div className="muted mini" style={{marginBottom:10}}>Keine Termine an diesem Tag.</div>}
    {items.map(a=>{const hidden=isPrivateHidden(a,isAdmin);const ps=hidden?[]:assignmentProjects(a,projects);
      const label=hidden?"Geblockt":(a.type==="frei"?(a.title||"Freier Termin"):(ps.map(p=>projLabel(p)).join(", ")||"Projekt"));
      const col=hidden?"#94a3b8":chipColor(a,projects,versicherungen);
      const addrs=hidden?[]:assignmentAddresses(a,projects);
      const rHome=addrs.length&&home?dayRouteUrl(addrs,home):null;
      const rStd=addrs.length?navRouteUrl(addrs):null;
      const meta=[hidden?"":(a.projektrolle||(a.type==="frei"?"Freier Termin":a.einsatz)),
        a.allDay===false&&a.startTime?(a.startTime+(a.endTime?"–"+a.endTime:"")+" Uhr"):"ganztägig",
        a.ort==="ausland"?"Ausland":""].filter(Boolean).join(" · ");
      return(<div key={a.id} className="rec-row" style={{borderLeft:"4px solid "+col,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:"1 1 160px",minWidth:0}}>
          <div style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis"}}>{hidden&&<span title="privat">🔒 </span>}{label}</div>
          <div className="mini muted">{meta}</div></div>
        <button className="btn sm" onClick={()=>onEdit(a)}><Ic d={ICONS.edit}/> {mayEdit?"Bearbeiten":"Ansehen"}</button>
        {!hidden&&<button className="btn sm" onClick={()=>downloadICS({title:label,date:ctx.date,allDay:a.allDay,startTime:a.startTime,endTime:a.endTime,
          location:addrs[0]||"",description:[a.projektrolle||a.einsatz||"",a.note].filter(Boolean).join("\n"),
          contactName:a.kontaktName,contactTel:a.kontaktTel,contactMail:a.kontaktMail})} title="In Kalender speichern (Outlook/Apple/Google)"><Ic d={ICONS.week}/> Kalender</button>}
        {rHome&&<a className="btn sm" href={rHome} target="_blank" rel="noopener" title="Route ab Wohnort des Mitarbeiters">🏠 ab Wohnort</a>}
        {rStd&&<a className="btn sm" href={rStd} target="_blank" rel="noopener" title="Route ab aktuellem Standort (GPS)">📍 ab Standort</a>}
      </div>);})}
  </Modal>);
}
function AssignModal({store,ctx,onClose}){
  const{projects,employees,einsatz,absences,api,appUrl,canTermFor}=store;
  const ed=ctx.editing;const emp=employees.find(e=>e.id===ctx.employeeId);
  const[mode,setMode]=useState(ed?ed.type:"project");
  const[selProjects,setSelProjects]=useState(ed?.projectNrs||[]);
  const[eins,setEins]=useState(ed?.einsatz||einsatz[0]||"");
  const[title,setTitle]=useState(ed?.title||"");const[ort,setOrt]=useState(ed?.ort||"inland");const[ortTouched,setOrtTouched]=useState(!!ed);
  const[notes,setNotes]=useState(seedNotes(ed));const[q,setQ]=useState("");
  const[fromDate,setFromDate]=useState(ctx.date);const[toDate,setToDate]=useState(ctx.date);
  const[allDay,setAllDay]=useState(ed?ed.allDay!==false:true);
  const[startTime,setStartTime]=useState(ed?.startTime||"08:00");const[endTime,setEndTime]=useState(ed?.endTime||"17:00");
  const[handTo,setHandTo]=useState("");
  const[projektrolle,setProjektrolle]=useState(ed?.projektrolle||"");
  const[freeAddr,setFreeAddr]=useState(ed?.adresse||"");
  const[privat,setPrivat]=useState(!!ed?.privat);
  const[kontaktName,setKontaktName]=useState(ed?.kontaktName||"");
  const[kontaktTel,setKontaktTel]=useState(ed?.kontaktTel||"");
  const[kontaktMail,setKontaktMail]=useState(ed?.kontaktMail||"");
  const activeProjects=projects.filter(p=>p.status!=="Beendet");
  const filtered=activeProjects.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase())||(p.alias||"").toLowerCase().includes(q.toLowerCase())||p.nr.includes(q));
  function toggleProj(nr){setSelProjects(s=>s.includes(nr)?s.filter(x=>x!==nr):[...s,nr]);}
  const selProjObjs=selProjects.map(nr=>projects.find(p=>p.nr===nr)).filter(Boolean);
  const versName=selProjObjs[0]?.versicherung||"";
  const projStandort=selProjObjs.length?effectiveStandort(selProjObjs[0]):"";
  useEffect(()=>{if(!ortTouched&&mode==="project"&&projStandort)setOrt(projStandort);},[projStandort,mode]);

  async function submit(){
    if(mode==="project"&&selProjects.length===0){store.showToast("Bitte mindestens ein Projekt wählen");return;}
    if(mode==="frei"&&!title.trim()){store.showToast("Bitte Titel eingeben");return;}
    const lo=fromDate>toDate?toDate:fromDate, hi=fromDate>toDate?fromDate:toDate;
    const dates=datesBetween(lo,hi);
    // Warnungen
    if(!ed&&emp?.gesperrt){if(!confirm(emp.name+" ist für die Einsatzplanung gesperrt. Trotzdem einplanen?"))return;}
    if(ort==="ausland"&&emp&&emp.freigabe_ausland===false){if(!confirm(emp.name+" hat KEINE Auslandsfreigabe. Trotzdem für den Auslandseinsatz einplanen?"))return;}
    const conflicts=dates.filter(d=>absenceOn(absences,ctx.employeeId,d));
    if(conflicts.length){const a=absenceOn(absences,ctx.employeeId,conflicts[0]);
      if(!confirm(emp?.name+" ist im gewählten Zeitraum abwesend ("+a.art+", "+conflicts.length+" Tag(e) betroffen). Trotzdem einplanen?"))return;}
    const base={employeeId:ctx.employeeId,type:mode,projectNrs:mode==="project"?selProjects:[],
      einsatz:mode==="project"?eins:null,title:mode==="frei"?title.trim():null,ort,notes,allDay,
      startTime:allDay?null:startTime,endTime:allDay?null:endTime,
      adresse:mode==="frei"?freeAddr.trim():null,projektrolle:mode==="project"?(projektrolle||null):null,
      privat:mode==="frei"?privat:false,
      kontaktName:kontaktName.trim(),kontaktTel:kontaktTel.trim(),kontaktMail:kontaktMail.trim()};
    if(selProjects.length===1&&(kontaktName.trim()||kontaktTel.trim()||kontaktMail.trim())){
      const p=projects.find(x=>x.nr===selProjects[0]);
      if(p&&(p.kontaktName!==kontaktName.trim()||p.kontaktTel!==kontaktTel.trim()||p.kontaktMail!==kontaktMail.trim())){
        api.saveProject({...p,kontaktName:kontaktName.trim(),kontaktTel:kontaktTel.trim(),kontaktMail:kontaktMail.trim()},false);
      }
    }
    if(ed){
      const ok=await api.updateAssignment({...base,id:ed.id,date:ctx.date,createdBy:ed.createdBy});
      if(!ok)return;
      const extra=dates.filter(d=>d!==ctx.date);
      if(extra.length)await api.addAssignments(extra.map(d=>({...base,date:d})));
      onClose();
    }else{
      if(await api.addAssignments(dates.map(d=>({...base,date:d}))))onClose();
    }
  }
  async function del(){if(await api.deleteAssignment(ed.id))onClose();}
  async function doHandover(){if(!handTo)return;const tgt=employees.find(e=>e.id===handTo);
    if(await api.handOver(ed.id,handTo,tgt?.name||""))onClose();}
  async function doMove(newDate){if(!newDate||newDate===ctx.date)return;
    if(await api.moveAssignment(ed.id,ctx.employeeId,newDate)){store.showToast("Verschoben auf "+fmtDE(newDate));onClose();}}

  const previewA={date:ctx.date,type:mode,projectNrs:selProjects,einsatz:eins,title,ort,note:deriveNoteText(notes),allDay,startTime,endTime,adresse:freeAddr,projektrolle};
  const msg=buildMessage(emp,previewA,projects,appUrl);
  const subj=mode==="project"?("Einsatzplanung "+fmtDE(ctx.date)):("Termin "+fmtDE(ctx.date));
  const handTgt=employees.find(e=>e.id===handTo);
  const handMsg=handTgt?buildMessage(handTgt,previewA,projects,appUrl):"";

  const mayEdit=canTermFor(ctx.employeeId);
  return(<Modal title={(ed?(mayEdit?"Einsatz bearbeiten":"Einsatz ansehen"):"Einsatz hinzufügen")+" · "+fmtDE(ctx.date)} onClose={onClose} wide
    footer={mayEdit?<>{ed&&<button className="btn danger" onClick={del}><Ic d={ICONS.trash}/> Löschen</button>}
      <span className="spacer"></span><button className="btn" onClick={onClose}>Abbrechen</button>
      <button className="btn primary" onClick={submit}>{ed?"Speichern":"Anlegen"}</button></>
      :<><span className="mini muted">Keine Berechtigung zum Bearbeiten dieses Termins.</span><span className="spacer"></span><button className="btn" onClick={onClose}>Schließen</button></>}>
    <div className="field"><label>Mitarbeiter</label><div style={{fontWeight:600,padding:"6px 0"}}>{emp?.name}
      {ed?.createdBy&&<span className="mini muted" style={{marginLeft:10,fontWeight:400}}>· eingetragen von {ed.createdBy}</span>}</div></div>
    <div className="pill-tabs" style={{marginBottom:16}}>
      <button className={mode==="project"?"active":""} onClick={()=>setMode("project")}>Projekteinsatz</button>
      <button className={mode==="frei"?"active":""} onClick={()=>setMode("frei")}>Freier Termin</button></div>

    <div className="row2"><div className="field"><label>{ed?"Zeitraum – von":"Von"}</label>
        <input type="date" value={fromDate} onChange={e=>{setFromDate(e.target.value);if(e.target.value>toDate)setToDate(e.target.value);}}/></div>
      <div className="field"><label>{ed?"bis (legt weitere Tage an)":"Bis (für ganze Woche „von–bis\")"}</label>
        <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}/></div></div>
    {ed&&(fromDate!==ctx.date||toDate!==ctx.date)&&<div className="mini muted" style={{marginTop:-6,marginBottom:12}}>
      Der aktuelle Eintrag ({fmtDE(ctx.date)}) wird gespeichert; für die übrigen Tage im Bereich werden zusätzliche Einträge mit denselben Angaben angelegt.</div>}

    {mode==="project"?<>
      <div className="field"><label>Projekt(e) suchen</label>
        <input placeholder="Name, Alias oder Nr…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <div className="field"><label>Projekte wählen (Mehrfachauswahl möglich) · {selProjects.length} gewählt</label>
        <div className="diffcol">{filtered.slice(0,80).map(p=>{const on=selProjects.includes(p.nr);
          return(<label key={p.nr} className="rec-row" style={{cursor:"pointer",borderColor:on?"var(--brand)":"var(--line)",background:on?"var(--brand-l)":"#fff"}}>
            <input type="checkbox" style={{width:"auto"}} checked={on} onChange={()=>toggleProj(p.nr)}/>
            <span style={{fontWeight:600}}>{p.alias?p.alias+" ":""}{p.name}</span><span className="muted mini">Nr. {p.nr}</span>
            <span className="spacer"></span>
            <span className="mini muted">{Math.round((p.fortschritt||0)*100)}%</span>
            <span className={"badge "+(STATUS_COLORS[p.status]||"b-gray")}>{p.status}</span></label>);})}
          {filtered.length===0&&<div className="muted mini" style={{padding:8}}>Keine Projekte gefunden.</div>}</div></div>
      <div className="field"><label>Tätigkeit / Einsatzstatus</label>
        <select value={eins} onChange={e=>setEins(e.target.value)}>{einsatz.map(x=><option key={x}>{x}</option>)}</select></div>
      <div className="field"><label>Projektrolle (optional – erscheint im Projekt-Planungsbalken &amp; in der Historie)</label>
        <select value={projektrolle} onChange={e=>setProjektrolle(e.target.value)}>
          <option value="">— keine —</option>{PROJEKTROLLEN.map(r=><option key={r}>{r}</option>)}</select></div>
      {selProjObjs.length>0&&<div className="notify-box" style={{marginBottom:14}}>
        <div style={{fontWeight:600,fontSize:12.5,marginBottom:6}}>Projektdaten</div>
        {selProjObjs.map(p=>{const st=effectiveStandort(p);return(<div key={p.nr} className="mini" style={{marginBottom:4}}>
          <b>{p.name}</b>{p.versicherung?<span className="badge b-gray" style={{marginLeft:6}}>{p.versicherung}</span>:null}
          <span className={"badge "+(st==="ausland"?"b-teal":"b-gray")} style={{marginLeft:6}}>{st==="ausland"?"Ausland":"Inland"}</span>
          {p.remote?<span className="badge b-violet" style={{marginLeft:6}}>Remote</span>:null}
          {(p.fahrzeugarten||[]).map(fa=><span key={fa} className="badge b-gray" style={{marginLeft:4}}>{fa}</span>)}
          {p.adresse?<div className="flex" style={{gap:6,marginTop:2}}><Ic d={ICONS.pin} style={{width:13,height:13,color:"var(--muted)"}}/>

    </>:<>

      <div className="field"><label>Adresse (optional – für Google-Maps-Link)</label>
        <input placeholder="Straße Hausnr, PLZ Ort" value={freeAddr} onChange={e=>setFreeAddr(e.target.value)}/>
        {freeAddr.trim()&&<a href={mapsLink(freeAddr)} target="_blank" rel="noopener" className="btn ghost sm" style={{marginTop:6}}><Ic d={ICONS.pin}/> Route öffnen</a>}</div>
      <div className="field"><label className="flex" style={{gap:8,cursor:"pointer",fontWeight:600}}>
        <input type="checkbox" style={{width:"auto"}} checked={privat} onChange={e=>setPrivat(e.target.checked)}/> 🔒 Privater Termin</label>
        <div className="mini muted" style={{marginTop:4}}>Nur Admins/Super-Admins sehen Titel &amp; Details. Für alle anderen erscheint der Termin nur als „Geblockt" (Terminblocker).</div></div>
    </>}

    <div className="field"><label>Zeit</label>
      <div className="pill-tabs" style={{marginBottom:allDay?0:10}}>
        <button className={allDay?"active":""} onClick={()=>setAllDay(true)}>Ganzer Tag</button>
        <button className={!allDay?"active":""} onClick={()=>setAllDay(false)}>Uhrzeit von–bis</button></div>
      {!allDay&&<div className="row2"><input type="time" value={startTime} onChange={e=>setStartTime(e.target.value)}/>
        <input type="time" value={endTime} onChange={e=>setEndTime(e.target.value)}/></div>}</div>

    <div className="field"><label>Ort {mode==="project"&&projStandort&&!ortTouched&&<span className="mini muted">· automatisch aus Projektstandort</span>}</label>

      <option value="inland">Inland</option><option value="ausland">Ausland</option></select></div>

      <div className="flex" style={{marginBottom:8}}>
        <div style={{fontWeight:600,fontSize:12.5}}>Ansprechpartner vor Ort (optional)</div>
        <span className="spacer"></span>
        {mode==="project"&&selProjects.length===1&&(()=>{const p=projects.find(x=>x.nr===selProjects[0]);
          return p&&(p.kontaktName||p.kontaktTel||p.kontaktMail)?<button type="button" className="btn ghost sm" onClick={()=>{setKontaktName(p.kontaktName||"");setKontaktTel(p.kontaktTel||"");setKontaktMail(p.kontaktMail||"");}}>Aus Projekt übernehmen</button>:null;})()}
      </div>

        <div className="field"><label>Name</label><input value={kontaktName} onChange={e=>setKontaktName(e.target.value)} placeholder="Vor- und Nachname"/></div>

function SendModal({store,onClose}){
  const{employees,assignments,techAssignments,projects,appUrl,workdays,pdfFields}=store;
  const now=new Date();const nx=new Date(now);nx.setDate(now.getDate()+7);
  const wk=isoWeek(nx),yr=isoYear(nx);const monday=mondayOfWeek(yr,wk);
  const days=workDaysOfWeek(monday,workdays).map(w=>w.date);
  const dates=days.map(ymd);
  const rows=employees.map(e=>({e,items:assignments.filter(a=>a.employeeId===e.id&&dates.includes(a.date))})).filter(r=>r.items.length>0);
  const dname=d=>DAYNAMES[(d.getDay()+6)%7];
  function personText(e,items){
    let t=`Hallo ${e.name.split(",")[1]?.trim()||e.name}, dein Einsatzplan für KW ${wk} (${fmtDEShort(days[0])}–${fmtDEShort(days[days.length-1])}):\n`;
    days.forEach((dd,i)=>{const d=ymd(dd);const dayItems=sortByTime(items.filter(a=>a.date===d));if(!dayItems.length)return;
      t+=`\n${dname(dd)} ${fmtDEShort(dd)}:`;
      dayItems.forEach(a=>{
        if(a.type==="frei"&&a.privat){t+=`\n  • Geblockt${timeLabel(a)?" "+timeLabel(a)+" Uhr":" ganztägig"}`;return;}
        const ps=assignmentProjects(a,projects);
        const lbl=a.type==="frei"?(a.title||"Freier Termin"):(ps.map(p=>p.name).join(", ")||"Projekt");
        t+=`\n  • ${lbl}${a.projektrolle?" – "+a.projektrolle:(a.einsatz?" ("+a.einsatz+")":"")}${timeLabel(a)?" "+timeLabel(a)+" Uhr":" ganztägig"}${a.ort==="ausland"?" [Ausland]":""}`;
        const adrs=[...ps.filter(p=>p.adresse).map(p=>p.adresse),a.adresse].filter(Boolean);
        adrs.forEach(ad=>{t+=`\n    Adresse: ${mapsLink(ad)}`;});});
      const stops=collectDayStops(e.id,d,assignments,techAssignments,projects);const url=dayRouteUrl(stops,e.adresse);
      if(url)t+=`\n    🧭 Tagesroute: ${url}`;});
    t+=`\n\nDein persönlicher Plan (Termine ansehen, Route & Kalender): ${personalLink(e.id,appUrl)}`;
    return t;}
  return(<Modal title={"Einsatzpläne senden · nächste Woche (KW "+wk+")"} onClose={onClose} wide
    footer={<button className="btn" onClick={onClose}>Schließen</button>}>
    <p className="muted mini" style={{marginTop:0}}>Pro Person: PDF herunterladen und/oder direkt als Nachricht (mit Zusammenfassung + Plan-Link) senden.
      {!appUrl&&<> <b>Tipp:</b> Hinterlege in den Einstellungen den „App-Link", damit der Link automatisch mitgeschickt wird.</>}</p>
    {rows.length===0?<div className="empty"><div className="big">Für nächste Woche ist noch nichts geplant</div>
      <div>Für nächste Woche sind noch keine Einsätze geplant.</div></div>:
      rows.map(({e,items})=>{const msg=personText(e,items);
        return(<div key={e.id} className="send-row">
          <div><div style={{fontWeight:600}}>{e.name}</div><div className="mini muted">{items.length} Einsätze · KW {wk}</div></div>
          <button className="btn sm" onClick={()=>generatePersonPDF(e,items,projects,days,wk,yr,appUrl,pdfFields)}><Ic d={ICONS.pdf}/> PDF</button>
          <a className="btn sm green" href={(e.phone||"").replace(/[^0-9]/g,"")?waLink(e.phone,msg):undefined} target="_blank" rel="noopener"
             style={(e.phone||"").replace(/[^0-9]/g,"")?{}:{opacity:.5,pointerEvents:"none"}}><Ic d={ICONS.wa}/></a>
          <a className="btn sm primary" href={e.email?mailLink(e.email,"Dein Einsatzplan KW "+wk,msg):undefined}
             style={e.email?{}:{opacity:.5,pointerEvents:"none"}}><Ic d={ICONS.mail}/></a>
          <button className="btn sm" title="Persönlichen Link kopieren" onClick={()=>{navigator.clipboard.writeText(personalLink(e.id,appUrl));store.showToast("Persönlicher Link kopiert");}}><Ic d={ICONS.link}/></button>
        </div>);})}
  </Modal>);
}

/* ============ TECHNIKERPLANUNG ============ */
function techColor(t,versicherungen){const v=(versicherungen||[]).find(x=>x.name===t.versicherung);return v?v.color:"var(--teal)";}
function fmtAW(n){return (Math.round(n*10)/10).toString();}
function buildTechMessage(emp,t,project,appUrl){
  const name=emp?(emp.name.split(",")[1]?.trim()||emp.name):"";
  const when=t.allDay===false&&t.startTime?(fmtDE(t.date)+", "+t.startTime+(t.endTime?"–"+t.endTime+" Uhr":" Uhr")):(fmtDE(t.date)+" (ganztägig)");
  let b="Einsatzplanung\n";
  b+="Techniker: "+name+"\n";
  b+="Projekt/Autohaus: "+(t.autohaus||project?.name||"-")+"\n";
  b+="Datum: "+when+"\n";
  if(t.dauer)b+="Einsatzdauer: "+t.dauer+"\n";
  if(t.adresse)b+="Adresse:\n"+t.adresse+"\n";
  const veh=(t.vehicles||[]).filter(v=>v.kennzeichen||v.vin);
  if(veh.length){b+="Fahrzeug(e):\n";veh.forEach(v=>{const parts=[];if(v.kennzeichen)parts.push("Kennzeichen: "+v.kennzeichen);if(v.vin)parts.push("VIN: "+v.vin);if(v.aw)parts.push("AW: "+v.aw);b+="  - "+parts.join(" · ")+"\n";});}
  const tot=awSum(t);if(tot)b+="Geplante AW gesamt: "+fmtAW(tot)+"\n";
  if(t.versicherung)b+="Versicherung: "+t.versicherung+"\n";
  if(t.note)b+="Bemerkung: "+t.note+"\n";
  if(t.adresse)b+="Route: "+mapsLink(t.adresse)+"\n";
  if(appUrl)b+="\nAktueller Plan: "+appUrl;
  return b;
}
function Technikerplanung({store,soloEmp}){
  const{employees,projects,techAssignments,absences,api,workdays,versicherungen,awCapacity,rolePlanung,isAdmin}=store;
  const now=new Date();
  const[wk,setWk]=useState(isoWeek(now));const[yr,setYr]=useState(isoYear(now));
  const[modal,setModal]=useState(null);const[dragId,setDragId]=useState(null);const[dropCell,setDropCell]=useState(null);const[techPop,setTechPop]=useState(null);
  const[empQ,setEmpQ]=useState("");const[projFilter,setProjFilter]=useState("");const[versFilter,setVersFilter]=useState("");const[hideUnavail,setHideUnavail]=useState(false);
  const monday=mondayOfWeek(yr,wk);
  const wdays=workDaysOfWeek(monday,workdays);const days=wdays.map(w=>w.date);const dayIdx=wdays.map(w=>w.idx);
  const weekDates=days.map(ymd);
  function nav(delta){let w=wk+delta,y=yr;if(w<1){y--;w=isoWeek(new Date(y,11,28));}else if(w>isoWeek(new Date(y,11,28))){y++;w=1;}setWk(w);setYr(y);}
  function matchesFilter(t){
    if(projFilter&&t.projectNr!==projFilter)return false;
    if(versFilter&&t.versicherung!==versFilter)return false;
    return true;}
  const cellItems=(empId,date)=>sortByTime(techAssignments.filter(t=>t.employeeId===empId&&t.date===date&&matchesFilter(t)));
  const visibleEmployees=soloEmp?employees.filter(e=>e.id===soloEmp):employees.filter(e=>showsInTech(e,rolePlanung)&&(!empQ||e.name.toLowerCase().includes(empQ.toLowerCase()))&&(!hideUnavail||!unavailableWholeWeek(e.id,weekDates,absences)));
  function onDrop(empId,date){if(!dragId)return;api.moveTech(dragId,empId,date);setDragId(null);setDropCell(null);}
  const usedVers=versicherungen.filter(v=>v.active!==false);
  const activeProjectsForFilter=projects.filter(p=>p.status!=="Beendet");
  // AW-Übersicht pro Techniker (diese Woche)
  const awRows=visibleEmployees.map(e=>{const mine=techAssignments.filter(t=>t.employeeId===e.id&&weekDates.includes(t.date)&&matchesFilter(t));
    const planned=mine.reduce((s,t)=>s+awSum(t),0);const done=mine.reduce((s,t)=>s+awDoneSum(t),0);
    return{e,planned,done,count:mine.length};}).filter(r=>r.count>0).sort((a,b)=>b.planned-a.planned);
  const weekPlanned=awRows.reduce((s,r)=>s+r.planned,0);

  return(<div>
    <div className="flex wrap" style={{marginBottom:12}}>
      <button className="btn sm nav-wk" onClick={()=>nav(-1)} title="Eine Kalenderwoche zurück"><Ic d={ICONS.chev} style={{transform:"rotate(180deg)"}}/> Zurück</button>
      <div style={{fontWeight:700,fontSize:16,minWidth:180,textAlign:"center"}}>Technik · KW {wk} · {yr}
        <div className="mini muted" style={{fontWeight:400}}>{fmtDEShort(days[0])} – {fmtDEShort(days[days.length-1])}</div></div>
      <button className="btn sm nav-wk" onClick={()=>nav(1)} title="Eine Kalenderwoche vor">Weiter <Ic d={ICONS.chev}/></button>
      <button className="btn sm" onClick={()=>{setWk(isoWeek(now));setYr(isoYear(now));}}>Heute</button>
      <span className="spacer"></span>
      <span className="badge b-teal" title="Geplante AW dieser Woche (sichtbare Techniker)">Σ AW Woche: {fmtAW(weekPlanned)}</span>
    </div>
    {!soloEmp&&<div className="flex wrap" style={{marginBottom:10,gap:8}}>
      <div style={{position:"relative"}}>
        <Ic d={ICONS.search} style={{position:"absolute",left:9,top:9,width:15,height:15,color:"var(--muted)"}}/>
        <input style={{paddingLeft:30,width:190,padding:"7px 10px 7px 30px"}} placeholder="Techniker suchen…" value={empQ} onChange={e=>setEmpQ(e.target.value)}/></div>
      <label className="flex mini" style={{gap:6,cursor:"pointer",whiteSpace:"nowrap"}} title="Blendet Techniker aus, die die ganze angezeigte Woche abwesend sind">
        <input type="checkbox" style={{width:"auto"}} checked={hideUnavail} onChange={e=>setHideUnavail(e.target.checked)}/> Nicht verfügbare ausblenden</label>
      <select style={{width:"auto",padding:"7px 10px"}} value={projFilter} onChange={e=>setProjFilter(e.target.value)}>
